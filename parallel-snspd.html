<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parallel-SNSPD</title>
<script>
  /* apply theme before paint: from ?theme= (set by the deck) */
  (function () {
    var m = (location.search || '').match(/theme=(dark|light)/);
    document.documentElement.setAttribute('data-theme', m ? m[1] : 'light');
  })();
</script>
<style>
  :root {
    --bg: #e9e6df;
    --panel: #f4f2ec;
    --ink: #23272e;
    --muted: #5d6570;
    --line: #c6c0b2;
    --photon: #b7791f;    /* amber */
    --term: #0f766e;      /* teal terms */
    --signal: #15803d;    /* green output */
    --warn: #c0392b;      /* undercount red */
    --accent: #2d5fb8;    /* count blue */
    --edge: #5a5346;
    --wire: #2f7fb8;      /* superconducting nanowire (cool) */
    --normal: #d9542f;    /* normal, resistive, hot */
    --bus: #8a8272;
  }
  :root[data-theme="dark"] {
    --bg: #171b20;
    --panel: #262b31;
    --ink: #ebe7dd;
    --muted: #a1abb5;
    --line: #3b414a;
    --photon: #e3a94e;
    --term: #37c6b8;
    --signal: #51c77d;
    --warn: #f06b6b;
    --accent: #6ea3f2;
    --edge: #8a8272;
    --wire: #4bb0e0;
    --normal: #f0774a;
    --bus: #9a927f;
  }
  html, body { transition: background-color .3s ease; }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    height: 100vh; overflow: hidden; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start;
    padding: 10px 12px 12px;
  }
  .bar { width: min(1240px, 97vw); display: flex; align-items: center; gap: 12px; padding: 4px 6px 8px; }
  .bar .spacer { margin-left: auto; }
  .bar button {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 15px; font-size: 15px; cursor: pointer;
  }
  .bar button:hover { border-color: var(--photon); }
  .bar button:focus-visible { outline: 2px solid var(--photon); outline-offset: 2px; }
  .bar button:disabled { opacity: .4; cursor: not-allowed; }
  .controls button { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .controls .chip { min-width: 34px; padding: 7px 0; text-align: center; font-size: 14px; }
  .controls .chip.active { border-color: var(--photon); color: var(--photon); font-weight: 700; }
  #sendBtn, #replay { font-family: inherit; }

  svg.scene { width: min(1240px, 97vw); height: auto; max-height: calc(100vh - 70px); display: block; }

  .cap   { font-size: 25px; font-weight: 700; fill: var(--ink); }
  .cap2  { font-size: 16px; fill: var(--muted); }
  .lbl   { font-size: 15px; fill: var(--muted); }
  .small { font-size: 14px; fill: var(--muted); }
  .term  { font-size: 16.5px; font-weight: 600; fill: var(--term); }
  .cnt   { font-size: 18px; fill: var(--ink); }
  .cntv  { font-size: 28px; font-weight: 800; fill: var(--ink); font-variant-numeric: tabular-nums; }

  .fade { opacity: 0; transition: opacity .5s ease; }
  .fade.on { opacity: 1; }

  .wire { fill: none; stroke: var(--wire); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round;
          transition: stroke .2s ease, stroke-width .2s ease; }
  .wire.normal { stroke: var(--normal); stroke-width: 4.6; }
</style>
</head>
<body>

<div class="bar controls" role="group" aria-label="step controls">
  <button id="prev" type="button" aria-label="previous step">&#9664;</button>
  <button id="play" type="button" aria-label="pause or play">&#10074;&#10074;</button>
  <button id="next" type="button" aria-label="next step">&#9654;</button>
  <span id="chips" style="display:flex; gap:6px; flex-wrap:wrap;"></span>
  <span class="spacer"></span>
  <button id="sendBtn" type="button">Send photons</button>
  <button id="replay" type="button">Replay</button>
</div>

<svg class="scene" viewBox="0 0 1280 730" role="img"
     aria-label="A parallel SNSPD: photons spread over many parallel superconducting nanowires and the wires that switch to the normal state are counted">

  <text id="cap"  class="cap"  x="640" y="40" text-anchor="middle"></text>
  <text id="cap2" class="cap2" x="640" y="68" text-anchor="middle"></text>

  <!-- light source above the array -->
  <g id="srcG" class="fade">
    <circle cx="430" cy="102" r="5.5" fill="var(--photon)"/>
    <circle cx="430" cy="102" r="11" fill="none" stroke="var(--photon)" stroke-width="1.6" opacity="0.55"/>
    <text class="small" x="450" y="98" fill="var(--photon)" font-weight="700">incident light, photons h&nu;</text>
  </g>
  <!-- illumination cone over the whole array -->
  <polygon id="cone" class="fade" points="430,110 150,196 710,196" fill="var(--photon)" opacity="0"/>

  <!-- the chip: parallel superconducting nanowires between a bias bus and a readout bus -->
  <g id="chip">
    <rect x="116" y="156" width="628" height="432" rx="12" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/>
    <line x1="150" y1="196" x2="710" y2="196" stroke="var(--bus)" stroke-width="4"/>
    <line x1="150" y1="548" x2="710" y2="548" stroke="var(--bus)" stroke-width="4"/>
    <text class="small" x="150" y="186">bias current I<tspan baseline-shift="sub" font-size="10">b</tspan>, all wires in parallel</text>
    <text class="small" x="150" y="572">summed readout</text>
    <g id="wires"></g>
    <text class="small" x="430" y="612" text-anchor="middle">one chip &#183; 10 parallel nanowires &#183; each biased near its critical current I<tspan baseline-shift="sub" font-size="10">c</tspan></text>
  </g>
  <g id="rain"></g>

  <!-- in-flight photons + hotspot flashes -->
  <g id="photons"></g>
  <g id="flash"></g>

  <!-- ============ right column ============ -->
  <g id="counters" class="fade">
    <rect x="800" y="150" width="420" height="196" rx="10" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/>
    <text class="cnt" x="826" y="200">photons arrived</text>
    <text class="cntv" id="cArr" x="1194" y="205" text-anchor="end">0</text>
    <text class="cnt" x="826" y="257">wires switched normal</text>
    <text class="cntv" id="cNorm" x="1194" y="262" text-anchor="end">0</text>
    <line x1="826" y1="284" x2="1194" y2="284" stroke="var(--line)" stroke-width="1.4"/>
    <text class="cnt" x="826" y="320" style="fill:var(--accent)" font-weight="700">photon number read</text>
    <text class="cntv" id="cRead" x="1194" y="325" text-anchor="end" style="fill:var(--accent)">0</text>
  </g>
  <text id="note" class="fade small" x="810" y="372" fill="var(--warn)" font-weight="700"></text>

  <g id="outP" class="fade">
    <rect x="800" y="392" width="420" height="230" rx="10" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/>
    <text class="term" x="1010" y="422" text-anchor="middle">summed output &#8733; wires switched normal</text>
    <line x1="850" y1="600" x2="1190" y2="600" stroke="var(--muted)" stroke-width="1.8"/>
    <line x1="850" y1="600" x2="850" y2="442" stroke="var(--muted)" stroke-width="1.8"/>
    <text class="small" x="860" y="456">output</text>
    <g id="outBars"></g>
  </g>

  <g id="takeaway" class="fade">
    <text class="term" x="430" y="655" text-anchor="middle">one identical pulse per wire that switches normal &#8594; partial photon-number resolution</text>
    <text class="term" x="430" y="681" text-anchor="middle">limits: shared wires, wire count, current redistribution, crosstalk</text>
  </g>

</svg>

<script>

<script>
(function () {
  "use strict";
  const SVGNS = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);
  const show = (el, on) => el && el.classList.toggle('on', !!on);
  const mk = (t, a) => { const e = document.createElementNS(SVGNS, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const clear = g => { while (g.firstChild) g.removeChild(g.firstChild); };
  const A = window.anime;

  /* ---- the parallel nanowires ---- */
  const N = 10, X0 = 190, PITCH = 52, WIDTH = 34, Y_TOP = 200, Y_BOT = 544, RUNGS = 6;
  const wiresG = $('wires'), photonsG = $('photons'), flashG = $('flash'), rainG = $('rain');

  function meander(xc) {
    const L = xc - WIDTH / 2, R = xc + WIDTH / 2, seg = (Y_BOT - Y_TOP) / RUNGS;
    let d = `M ${xc},${Y_TOP} L ${L},${Y_TOP}`, atL = true;
    for (let k = 0; k < RUNGS; k++) {
      const y2 = Y_TOP + (k + 1) * seg;
      d += ` L ${atL ? L : R},${y2}`;
      atL = !atL;
      d += ` L ${atL ? L : R},${y2}`;
    }
    d += ` L ${xc},${Y_BOT}`;
    return d;
  }
  const wires = [];
  for (let w = 0; w < N; w++) {
    const xc = X0 + w * PITCH;
    const el = mk('path', { d: meander(xc), class: 'wire' });
    wiresG.appendChild(el);
    wires.push({ el, cx: xc, cy: (Y_TOP + Y_BOT) / 2, normal: false });
  }
  const SRC = { x: 430, y: 102 };

  /* ---- counters + output ---- */
  const cArr = $('cArr'), cNorm = $('cNorm'), cRead = $('cRead'), outBars = $('outBars');
  let arrived = 0, switched = 0, runId = 0;

  function setCounters() {
    cArr.textContent = arrived; cNorm.textContent = switched; cRead.textContent = switched;
    cNorm.style.fill = arrived > switched ? 'var(--warn)' : '';
  }
  function drawOut(n) {
    clear(outBars);
    const w = 70, h = 26, gap = 8, x = 880, baseY = 600;
    for (let i = 0; i < n; i++) {
      outBars.appendChild(mk('rect', { x, y: baseY - (i + 1) * (h + gap) + gap, width: w, height: h, rx: 3,
                                       fill: 'var(--signal)', stroke: 'var(--bg)', 'stroke-width': 1.5 }));
    }
    if (n > 0) {
      const t = mk('text', { x: x + w + 14, y: baseY - n * (h + gap) + gap + 19, 'font-size': 20,
                             'font-weight': 700, fill: 'var(--signal)' });
      t.textContent = '= ' + n;
      outBars.appendChild(t);
    }
  }

  function resetWires() {
    runId++;
    wires.forEach(w => { w.normal = false; w.el.setAttribute('class', 'wire'); });
    clear(photonsG); clear(flashG);
    arrived = 0; switched = 0; setCounters(); drawOut(0);
  }

  function hotspot(cx, cy) {
    const ring = mk('circle', { cx, cy, r: 5, fill: 'none', stroke: 'var(--normal)', 'stroke-width': 2.8, opacity: 1 });
    flashG.appendChild(ring);
    const dot = mk('circle', { cx, cy, r: 5.5, fill: 'var(--normal)', opacity: 0.9 });
    flashG.appendChild(dot);
    if (A) {
      A({ targets: ring, r: [5, 34], opacity: [0.95, 0], duration: 650, easing: 'easeOutQuad',
          complete: () => { if (ring.parentNode) ring.parentNode.removeChild(ring); } });
      A({ targets: dot, opacity: [0.9, 0], duration: 900, easing: 'easeOutQuad',
          complete: () => { if (dot.parentNode) dot.parentNode.removeChild(dot); } });
    } else { ring.setAttribute('opacity', 0); dot.setAttribute('opacity', 0); }
  }

  function hitWire(wi) {
    arrived++;
    const w = wires[wi];
    if (!w.normal) { w.normal = true; w.el.setAttribute('class', 'wire normal'); switched++; }
    hotspot(w.cx, w.cy);
    setCounters(); drawOut(switched);
  }

  function makePhoton() {
    const g = mk('g', { opacity: 0 });
    g.appendChild(mk('path', { d: 'M 0,0 q 7,10 0,20 q -7,10 0,20 q 7,10 0,20',
                               fill: 'none', stroke: 'var(--photon)', 'stroke-width': 3, 'stroke-linecap': 'round' }));
    g.appendChild(mk('path', { d: 'M -4,52 L 0,61 L 4,52', fill: 'none', stroke: 'var(--photon)',
                               'stroke-width': 3, 'stroke-linejoin': 'round' }));
    photonsG.appendChild(g);
    return g;
  }

  /* photons travel from the source down to their wires; each landing switches one wire normal */
  function sendBurst(targets, instant) {
    resetWires();
    const id = runId;
    if (instant || !A) { targets.forEach(wi => hitWire(wi)); return; }
    targets.forEach((wi, k) => {
      const w = wires[wi], g = makePhoton();
      g.setAttribute('transform', 'translate(' + SRC.x + ',' + SRC.y + ')');
      g.setAttribute('opacity', 1);
      A({ targets: g, translateX: w.cx, translateY: w.cy - 64, duration: 620, delay: k * 280,
          easing: 'easeInQuad',
          complete: () => { if (id !== runId) return; g.setAttribute('opacity', 0); hitWire(wi); } });
    });
  }

  /* ---- light drizzle over the whole array (spatial multiplexing step) ---- */
  const drops = [
    { x: 210, y: 250, v: 1.6 }, { x: 290, y: 360, v: 1.9 }, { x: 360, y: 230, v: 1.5 },
    { x: 440, y: 430, v: 1.8 }, { x: 520, y: 300, v: 1.6 }, { x: 600, y: 390, v: 2.0 },
    { x: 660, y: 240, v: 1.7 }, { x: 250, y: 470, v: 1.8 }, { x: 560, y: 210, v: 1.5 }
  ].map(d => { const c = mk('circle', { cx: d.x, cy: d.y, r: 3.5, fill: 'var(--photon)', opacity: 0 });
               rainG.appendChild(c); return Object.assign({ el: c }, d); });
  let rainOn = false;
  (function rainLoop() {
    drops.forEach(d => {
      if (!rainOn) { d.el.setAttribute('opacity', 0); return; }
      d.y += d.v; if (d.y > 540) d.y = 205;
      d.el.setAttribute('cy', d.y.toFixed(1));
      d.el.setAttribute('opacity', (d.y < 220 ? 0.2 : 0.55));
    });
    requestAnimationFrame(rainLoop);
  })();

  /* ---- steps ---- */
  const STEPS = [
    { cap: "1. The array: many parallel superconducting nanowires.",
      cap2: "Each nanowire is a superconducting SNSPD biased near its critical current: a photon switches it to the normal, resistive state.",
      on: [] },
    { cap: "2. The light is spread over the whole array: spatial multiplexing.",
      cap2: "Incident light is distributed over many independent nanowires, so simultaneous photons tend to land on different wires.",
      on: ['srcG', 'cone'], rain: true },
    { cap: "3. Three photons arrive together: three wires switch normal.",
      cap2: "Each struck wire diverts its bias current and gives one standard pulse. Counting the wires that switched normal reads the photon number: three.",
      on: ['srcG', 'counters', 'outP'], burst: [1, 5, 8] },
    { cap: "4. The limit: two photons land on the same wire.",
      cap2: "That wire switches only once, so the array undercounts. Number resolution needs many more wires than photons.",
      on: ['srcG', 'counters', 'note', 'outP'], burst: [3, 3, 7],
      note: "3 photons arrived, 2 wires switched → reads 2: an undercount" },
    { cap: "5. The output: the parallel currents are summed.",
      cap2: "Each wire that switches normal adds one identical step, so the summed amplitude is proportional to the number switched.",
      on: ['srcG', 'counters', 'outP', 'takeaway'], burst: [0, 3, 6, 9] }
  ];
  const ALL = ['srcG', 'cone', 'counters', 'note', 'outP', 'takeaway'];

  let i = 0, playing = true, timer = null;

  const chipsBox = $('chips');
  STEPS.forEach((_, k) => {
    const b = document.createElement('button');
    b.className = 'chip'; b.type = 'button'; b.textContent = k + 1;
    b.addEventListener('click', () => { stop(); go(k); });
    chipsBox.appendChild(b);
  });
  const chips = Array.from(chipsBox.children);

  function render(step, instant) {
    const s = STEPS[step];
    $('cap').textContent = s.cap;
    $('cap2').textContent = s.cap2;
    $('note').textContent = s.note || '';
    const onset = new Set(s.on || []);
    ALL.forEach(id => show($(id), onset.has(id)));
    $('cone').style.opacity = onset.has('cone') ? 0.12 : 0;

    rainOn = !!s.rain;
    resetWires();
    if (s.burst) sendBurst(s.burst, instant);
    $('sendBtn').disabled = !s.burst;

    chips.forEach((c, k) => c.classList.toggle('active', k === step));
  }

  function go(n, instant) { i = Math.max(0, Math.min(STEPS.length - 1, n)); render(i, instant); }
  function next() { if (i < STEPS.length - 1) go(i + 1); else stop(); }
  function stopTimer() { if (timer) { clearTimeout(timer); timer = null; } }
  function auto() { stopTimer(); timer = setTimeout(() => { if (playing) { if (i < STEPS.length - 1) { next(); auto(); } else stop(); } }, 4200); }
  function play() { playing = true; $('play').innerHTML = '&#10074;&#10074;'; if (i >= STEPS.length - 1) go(0); auto(); }
  function stop() { playing = false; $('play').innerHTML = '&#9654;'; stopTimer(); }

  $('next').addEventListener('click', () => { stop(); next(); });
  $('prev').addEventListener('click', () => { stop(); go(i - 1); });
  $('play').addEventListener('click', () => { playing ? stop() : play(); });
  $('replay').addEventListener('click', () => { go(0); play(); });
  $('sendBtn').addEventListener('click', () => { const s = STEPS[i]; if (s.burst) sendBurst(s.burst, false); });
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') { stop(); next(); }
    if (e.key === 'ArrowLeft') { stop(); go(i - 1); }
  });

  const h = parseInt((location.hash || '').slice(1), 10);
  if (Number.isFinite(h)) { go(h, true); } else { go(0, true); play(); }
})();
</script>
<script>
/* theme sync: accept postMessage from the deck (initial theme read pre-paint from ?theme=) */
(function () {
  var d = document.documentElement;
  addEventListener('message', function (e) {
    if (e && e.data && (e.data.theme === 'dark' || e.data.theme === 'light'))
      d.setAttribute('data-theme', e.data.theme);
  });
})();
</script>
