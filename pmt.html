<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PMT</title>
<style>
  :root {
    --bg: #e9e6df;
    --panel: #f4f2ec;
    --ink: #23272e;
    --muted: #5d6570;
    --line: #c6c0b2;
    --tube: #8b8578;
    --photon: #b7791f;
    --e: #2d5fb8;
    --dynode: #b45309;
    --cathodecol: #52606d;
    --anodecol: #334155;
    --volt: #5b3fb5;
    --term: #0f766e;
    --signal: #15803d;
    --hot: #c02626;
    --edge: #8a8374;
  }
  :root[data-theme="dark"] {
    --bg: #171b20; --panel: #262b31; --ink: #ebe7dd; --muted: #a1abb5; --line: #3b414a;
    --tube: #9b958a; --photon: #e3a94e; --e: #6ea3f2; --dynode: #cf7a2a;
    --cathodecol: #8a97a3; --anodecol: #7688a0; --volt: #ab8ffb; --term: #37c6b8;
    --signal: #51c77d; --hot: #f06b6b; --edge: #7d766a;
  }
  html, body { height: 100%; transition: background-color .3s ease; }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    display: grid; grid-template-rows: auto auto minmax(0,1fr);
    padding: 8px 12px 10px; gap: 2px;
  }
  .bar { width: min(1320px, 98vw); margin: 0 auto; display: flex; align-items: center; gap: 10px; padding: 3px 6px 6px; }
  .bar h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
  .bar .spacer { margin-left: auto; }
  .bar button {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 13px; font-size: 14px; cursor: pointer; font-family: inherit;
  }
  .bar button:hover { border-color: var(--photon); }
  .bar button:focus-visible { outline: 2px solid var(--photon); outline-offset: 2px; }
  .controls button { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .controls .chip { min-width: 32px; padding: 6px 0; text-align: center; font-size: 13px; }
  .controls .chip.active { border-color: var(--photon); color: var(--photon); font-weight: 700; }
  .controls .name { color: var(--muted); font-size: 13.5px; margin-left: 6px; }
  .stage { min-height: 0; display: flex; align-items: center; justify-content: center; }
  .stage svg { width: min(1320px, 98vw); height: 100%; }

  .cap   { font-size: 26px; font-weight: 700; fill: var(--ink); }
  .cap2  { font-size: 18px; fill: var(--muted); }
  .lbl   { font-size: 17px; fill: var(--muted); }
  .term  { font-size: 19px; font-weight: 700; fill: var(--term); }
  .volt  { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
           font-size: 16px; font-weight: 700; fill: var(--volt); }
  .cnt   { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
           font-size: 44px; font-weight: 700; fill: var(--photon); }
  .small { font-size: 15px; fill: var(--muted); }
  .note  { font-size: 19px; font-weight: 700; fill: var(--e); }
  .pkey  { font-size: 17px; fill: var(--muted); }
  .pval  { font-size: 17px; font-weight: 700; fill: var(--ink); }
</style>
</head>
<body>

<div class="bar">
  <h1>Photomultiplier tube</h1>
  <span class="spacer"></span>
  <button id="replay" type="button">Replay</button>
</div>
<div class="bar controls" role="group" aria-label="step controls">
  <button id="prev" type="button" aria-label="previous step">&#9664;</button>
  <button id="play" type="button" aria-label="pause or play">&#9654;</button>
  <button id="next" type="button" aria-label="next step">&#9654;&#9654;</button>
  <span id="chips" style="display:flex; gap:5px; flex-wrap:wrap;"></span>
</div>

<div class="stage">
<svg viewBox="0 0 1280 700" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Animated cross-section of a photomultiplier tube">

  <text id="cap"  class="cap"  x="640" y="38" text-anchor="middle"></text>
  <text id="cap2" class="cap2" x="640" y="68" text-anchor="middle"></text>
  <text id="cap3" class="cap2" x="640" y="92" text-anchor="middle"></text>

  <!-- vacuum tube envelope -->
  <g id="gTube">
    <rect id="tube" x="180" y="130" width="735" height="380" rx="44"
          fill="none" stroke="var(--tube)" stroke-width="2.5"/>
    <text id="vaclab" class="lbl" x="900" y="494" text-anchor="end">vacuum</text>
  </g>

  <!-- photocathode: entrance plate at the left -->
  <g id="gCath">
    <rect x="215" y="180" width="10" height="260" rx="3" fill="var(--cathodecol)"/>
    <line x1="168" y1="214" x2="211" y2="252" stroke="var(--term)" stroke-width="1.4" stroke-dasharray="4 5"/>
    <text class="term" x="160" y="205" text-anchor="end">photocathode</text>
    <text class="volt" x="160" y="232" text-anchor="end">&#8722;1000 V</text>
  </g>

  <!-- dynodes generated by script into this group -->
  <g id="gDyn"></g>

  <!-- anode -->
  <g id="gAnode">
    <line x1="860" y1="240" x2="860" y2="400" stroke="var(--anodecol)" stroke-width="7" stroke-linecap="round"/>
    <text class="term" x="860" y="224" text-anchor="middle">anode</text>
    <text class="volt" x="908" y="432" text-anchor="end">&#8776; 0 V</text>
  </g>

  <!-- voltage divider chain, generated by script -->
  <g id="gChain"></g>

  <!-- photoelectric-conversion note (step 3) -->
  <g id="cathnote" style="opacity:0">
    <text class="note" x="160" y="362" text-anchor="end">h&#957; &gt; emission threshold</text>
    <text class="note" x="160" y="390" text-anchor="end">&#8594; 1 e&#8315;</text>
  </g>

  <!-- per-stage potential difference (steps 4 and on) -->
  <text id="dvlbl" class="volt" x="365" y="618" text-anchor="middle" style="opacity:0">&#916;V &#8776; 100 V per stage</text>

  <!-- right panel: electron counter and anode-signal scope -->
  <g id="gPanels">
    <rect x="960" y="128" width="300" height="118" rx="10" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/>
    <text class="lbl" x="1110" y="156" text-anchor="middle">electrons</text>
    <text id="count" class="cnt" x="1110" y="208" text-anchor="middle">0</text>
    <text id="deltaNote" class="small" x="1110" y="234" text-anchor="middle" style="opacity:0">&#215; &#948; per dynode (&#948; &#8776; 4)</text>
    <rect x="960" y="262" width="300" height="168" rx="10" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/>
    <text class="lbl" x="1110" y="288" text-anchor="middle">anode signal</text>
    <line x1="978" y1="406" x2="1242" y2="406" stroke="var(--line)" stroke-width="2"/>
  </g>
  <path id="pulse" style="opacity:0" d="M 978,406 L 1025,406 L 1042,300 C 1050,300 1064,338 1090,370 C 1118,396 1180,406 1242,406"
        fill="none" stroke="var(--signal)" stroke-width="3" stroke-linecap="round"/>

  <!-- signal takeoff from the anode node into the scope -->
  <g id="gSig" style="opacity:0">
    <path d="M 860,548 H 940 V 344 H 958" fill="none" stroke="var(--signal)" stroke-width="2.4"/>
    <text class="small" x="900" y="540" text-anchor="middle" fill="var(--signal)" font-weight="600"
          stroke="var(--bg)" stroke-width="5" paint-order="stroke">signal out</text>
  </g>

  <!-- PMT property values, revealed at the last step -->
  <g id="gProps" style="opacity:0">
    <rect x="960" y="448" width="300" height="236" rx="12" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/>
    <text x="978" y="480" font-size="19" font-weight="700" fill="var(--term)">PMT properties</text>
    <text class="pkey" x="978" y="514">efficiency &#951;: <tspan class="pval">10&#8211;40%</tspan></text>
    <text class="pkey" x="978" y="548">dark counts: <tspan class="pval">~100 /s</tspan></text>
    <text class="pkey" x="978" y="582">dead time: <tspan class="pval">~ns</tspan></text>
    <text class="pkey" x="978" y="616">timing jitter: <tspan class="pval">hundreds of ps</tspan></text>
    <text class="pkey" x="978" y="650">photon number: <tspan class="pval">not resolved</tspan></text>
  </g>

  <!-- electron dots and impact flashes, generated by script -->
  <g id="gDots"></g>
  <g id="gFx"></g>

  <!-- photon: straight line plus arrowhead -->
  <g id="photon" style="opacity:0">
    <line x1="-64" y1="0" x2="-16" y2="0" stroke="var(--photon)" stroke-width="4.5" stroke-linecap="round"/>
    <polygon points="0,0 -14,-7.5 -14,7.5" fill="var(--photon)"/>
    <text x="-40" y="-16" font-size="16" text-anchor="middle" fill="var(--photon)" font-weight="700">photon h&#957;</text>
  </g>

  <text x="547" y="696" text-anchor="middle" font-style="italic" font-size="13"
        fill="var(--muted)" opacity="0.8">Inspired by the Hamamatsu &#8220;Photomultiplier Tubes&#8221; handbook (Fig. 2-5)</text>
</svg>
</div>

<script>

<script>
(function(){
  "use strict";
  var SVGNS = "http://www.w3.org/2000/svg";
  function $(id){ return document.getElementById(id); }
  function mk(t,a,parent){ var e=document.createElementNS(SVGNS,t); for(var k in a) e.setAttribute(k,a[k]); if(parent) parent.appendChild(e); return e; }

  var _seed = 246813579;
  function rnd(){ _seed=(_seed*1103515245+12345)&0x7fffffff; return _seed/0x7fffffff; }

  // ---------------- geometry: photocathode -> D1..D6 -> anode ----------------
  var K = [225,310], A = [860,310];
  var DYN = [[320,440],[410,190],[500,440],[590,190],[680,440],[770,190]];
  var NODES = [K].concat(DYN).concat([A]);
  var VOLTS = ['−900 V','−800 V','−700 V','−600 V','−500 V','−400 V'];

  // dynode plates: concave bars, cup opens toward the incoming electrons
  var gDyn = $('gDyn'), dynGroups = [];
  DYN.forEach(function(p,i){
    var x=p[0], y=p[1], bottom = y>300;
    var dy = bottom? 17 : -17, bow = bottom? 11 : -11;
    var g = mk('g',{},gDyn);
    mk('path',{ d:'M '+(x-26)+','+(y-dy)+' Q '+x+','+(y+bow)+' '+(x+26)+','+(y+dy),
      fill:'none', stroke:'var(--dynode)', 'stroke-width':7, 'stroke-linecap':'round' },g);
    var t = mk('text',{ 'class':'volt', x:x, y: bottom? y+38 : y-28, 'text-anchor':'middle' },g);
    t.textContent = 'D'+(i+1)+' '+VOLTS[i];
    dynGroups.push(g);
  });

  // hop curves (quadratic Bezier control points, never drawn)
  var HOP = [];
  (function(){
    for(var k=0;k<NODES.length-1;k++){
      var p0=NODES[k], p2=NODES[k+1];
      var mx=(p0[0]+p2[0])/2, my=(p0[1]+p2[1])/2;
      var dx=p2[0]-p0[0], dy=p2[1]-p0[1], len=Math.hypot(dx,dy);
      var bow=30;
      HOP.push({p0:p0, p1:[mx-dy/len*bow, my+dx/len*bow], p2:p2});
    }
  })();
  function bez(h,t){
    var a=(1-t)*(1-t), b=2*(1-t)*t, c=t*t;
    return [a*h.p0[0]+b*h.p1[0]+c*h.p2[0], a*h.p0[1]+b*h.p1[1]+c*h.p2[1]];
  }

  // ---------------- voltage divider chain ----------------

  (function(){
    var RY=580, TAPX=[225,320,410,500,590,680,770,860];
    for(var i=0;i<TAPX.length-1;i++){
      var a=TAPX[i], b=TAPX[i+1], seg=(b-a-44)/2;
      mk('path',{ d:'M '+a+','+RY+' h '+seg+' l 5.5,-8 l 5.5,16 l 5.5,-16 l 5.5,16 l 5.5,-8 h '+seg,
        fill:'none', stroke:'var(--edge)', 'stroke-width':2 },gChain);
    }
    TAPX.forEach(function(x){
      mk('circle',{cx:x,cy:RY,r:3,fill:'var(--edge)'},gChain);
      mk('line',{x1:x,y1:RY,x2:x,y2:516,stroke:'var(--edge)','stroke-width':1.4,'stroke-dasharray':'3 5',opacity:0.6},gChain);
    });
    // high-voltage supply at the cathode end of the chain
    mk('path',{d:'M 225,'+RY+' H 100 V 596',fill:'none',stroke:'var(--edge)','stroke-width':2},gChain);
    mk('line',{x1:82,y1:598,x2:118,y2:598,stroke:'var(--edge)','stroke-width':2},gChain);
    mk('line',{x1:90,y1:606,x2:110,y2:606,stroke:'var(--edge)','stroke-width':5},gChain);
    mk('path',{d:'M 100,608 V 622',fill:'none',stroke:'var(--edge)','stroke-width':2},gChain);
    mk('line',{x1:86,y1:622,x2:114,y2:622,stroke:'var(--edge)','stroke-width':2.4},gChain);
    mk('line',{x1:92,y1:628,x2:108,y2:628,stroke:'var(--edge)','stroke-width':2},gChain);
    mk('line',{x1:97,y1:634,x2:103,y2:634,stroke:'var(--edge)','stroke-width':1.6},gChain);
    var hv=mk('text',{'class':'small',x:118,y:660,'text-anchor':'middle'},gChain);
    hv.textContent='high-voltage supply';
    // load resistor to ground at the anode end
    mk('path',{d:'M 860,'+RY+' h 18 l 4,-8 l 5.5,16 l 5.5,-16 l 5.5,16 l 4,-8 h 14',
      fill:'none',stroke:'var(--edge)','stroke-width':2},gChain);
    mk('line',{x1:922,y1:572,x2:950,y2:572,stroke:'var(--edge)','stroke-width':2.4},gChain);
    mk('line',{x1:928,y1:578,x2:944,y2:578,stroke:'var(--edge)','stroke-width':2},gChain);
    mk('line',{x1:933,y1:584,x2:939,y2:584,stroke:'var(--edge)','stroke-width':1.6},gChain);
    var rl=mk('text',{'class':'volt',x:894,y:614,'text-anchor':'middle'},gChain);
    rl.innerHTML='R<tspan baseline-shift="sub" font-size="11">L</tspan>';
  })();

  // ---------------- electron dots and impact flashes ----------------
  var NDOTS=40, dots=[], offs=[];
  var gDots=$('gDots');
  for(var i=0;i<NDOTS;i++){
    dots.push(mk('circle',{cx:0,cy:0,r:3.2,fill:'var(--e)'},gDots));
    dots[i].style.opacity='0';
    var ang=rnd()*6.2832, rad=Math.sqrt(rnd());
    offs.push({x:Math.cos(ang)*rad, y:Math.sin(ang)*rad*0.72, lag:rnd()*0.25});
  }
  var gFx=$('gFx'), fx=[];
  NODES.forEach(function(p,i){
    var col = i===0? 'var(--photon)' : (i===NODES.length-1? 'var(--signal)' : 'var(--e)');
    fx.push(mk('circle',{cx:p[0],cy:p[1],r:6,fill:col},gFx));
    fx[i].style.opacity='0';
  });

  // place n dots as a cluster around hop h at parameter u
  function placeBunch(h,u,n,spread){
    for(var i=0;i<NDOTS;i++){
      if(i>=n){ dots[i].style.opacity='0'; continue; }
      var p=bez(HOP[h],u);
      dots[i].setAttribute('cx',(p[0]+offs[i].x*spread).toFixed(1));
      dots[i].setAttribute('cy',(p[1]+offs[i].y*spread).toFixed(1));
      dots[i].setAttribute('r', n>16? 2.5 : 3.2);
      dots[i].style.opacity='1';
    }
  }
  function hideDots(){ for(var i=0;i<NDOTS;i++) dots[i].style.opacity='0'; }

  // ---------------- captions ----------------
  var STEPS = [
    { id:'build', name:'build', count:'0',
      cap:'Build',
      l1:'The photocathode is a thin layer of a low work function material, in practice a semiconductor.',
      l2:'Each dynode emits several secondary electrons when one electron strikes it. The anode collects the electrons and delivers the output.' },
    { id:'photon', name:'photon in', count:'0',
      cap:'Photon in',
      l1:'A single photon flies in and reaches the photocathode.',
      l2:'The photoelectric effect can free one electron.' },
    { id:'photoelectron', name:'photoelectron', count:'1',
      cap:'Photoelectron',
      l1:'One photoelectron leaves the photocathode if h&#957; exceeds the emission threshold.',
      l2:'Only 10 to 40 percent of photons eject an electron: this sets the efficiency &#951;.' },
    { id:'acceleration', name:'acceleration', count:'1',
      cap:'Acceleration',
      l1:'The potential difference of about 100 V per stage creates the field that accelerates the electron.',
      l2:'In vacuum it flies free and gains about 100 eV.' },
    { id:'multiplication', name:'multiplication', count:'16',
      cap:'Multiplication',
      l1:'The impact on D1 frees about 4 secondary electrons.',
      l2:'Each one speeds to the next dynode and repeats: 1, then 4, then 16.' },
    { id:'gain', name:'gain', count:'4,096',
      cap:'Gain',
      l1:'Every dynode multiplies the count by &#948; &#8776; 4. A typical tube has ten dynodes, so ten stages turn one photoelectron into about one million electrons.',
      l2:'This drawing shows six dynodes, so the counter reaches 4<tspan baseline-shift="super" font-size="13">6</tspan> = 4096.' },
    { id:'output', name:'output pulse', count:'4,096',
      cap:'Output pulse',
      l1:'One single photon at the entrance became a measurable electrical pulse at the output.',
      l2:'The pulse is large enough for standard electronics; its height ignores the photon number.' }
  ];
  var N = STEPS.length;

  // ---------------- engine: park instantly, then play the step's motion ----------------
  var cur = 0, active = [], timers = [];
  var tube=$('tube'), photon=$('photon'), count=$('count'), pulse=$('pulse');
  var groups = { gTube:$('gTube'), gCath:$('gCath'), gDyn:gDyn, gAnode:$('gAnode'),
                 gChain:gChain, gPanels:$('gPanels') };
  count.style.transformOrigin='1110px 208px';

  function later(fn,ms){ timers.push(setTimeout(fn,ms)); }
  function stopAll(){
    timers.forEach(clearTimeout); timers=[];
    active.forEach(function(a){ a.pause(); }); active=[];
  }

  function setCaption(i){
    $('cap').textContent = STEPS[i].cap;
    $('cap2').innerHTML = STEPS[i].l1;
    $('cap3').innerHTML = STEPS[i].l2;
  }

  // parkScene(i): set the whole scene to the END state of step i, instantly.
  // i = -1 gives the blank pre-build scene that step 0 plays from.
  function parkScene(i){
    var on = i>=0;
    for(var k in groups) groups[k].style.opacity = on? '1':'0';
    dynGroups.forEach(function(g){ g.style.opacity='1'; });
    tube.removeAttribute('stroke-dasharray'); tube.removeAttribute('stroke-dashoffset');
    fx.forEach(function(f){ f.style.opacity='0'; f.setAttribute('r',6); });
    // photon parked at the photocathode only at the end of step 1
    if(i===1){ photon.style.opacity='1'; photon.style.transform='translate(210px,310px)'; }
    else { photon.style.opacity='0'; photon.style.transform='translate(210px,310px) translateX(-280px)'; }
    $('cathnote').style.opacity = (i===2)? '1':'0';
    $('dvlbl').style.opacity = (i>=3)? '1':'0';
    $('deltaNote').style.opacity = (i>=4)? '1':'0';
    count.textContent = on? STEPS[i].count : '0';
    count.style.transform='';
    if(i===2) placeBunch(0,0.20,1,0);
    else if(i===3) placeBunch(0,0.75,1,0);
    else if(i===4) placeBunch(2,1,16,13);
    else if(i===5) placeBunch(6,0.55,40,26);
    else hideDots();
    if(i===6){ pulse.style.opacity='1'; pulse.removeAttribute('stroke-dasharray'); pulse.removeAttribute('stroke-dashoffset'); }
    else pulse.style.opacity='0';
    $('gSig').style.opacity = (i===6)? '1':'0';
    $('gProps').style.opacity = (i===6)? '1':'0';
    if(on) setCaption(i);
  }

  function reg(params){ var a=anime(params); active.push(a); return a; }

  function flash(nodeIdx,big){
    var f=fx[nodeIdx];
    f.setAttribute('r',5); f.style.opacity='0';
    reg({ targets:f, r:[5, big?26:20], duration:420, easing:'easeOutQuad',
          opacity:[{value:0.85,duration:40},{value:0,duration:380}] });
  }

  function bumpCount(v){
    count.textContent=v;
    reg({ targets:count, scale:[1.3,1], duration:300, easing:'easeOutBack' });
  }

  // fly n dots along hop h from u0 to u1
  function fly(h,n,spread,u0,u1,dur,easing,done){
    var pr={u:0};
    for(var i=0;i<NDOTS;i++){
      dots[i].setAttribute('r', n>16? 2.5:3.2);
      dots[i].style.opacity = i<n? '1':'0';
    }
    reg({ targets:pr, u:1, duration:dur, easing:easing,
      update:function(){
        for(var i=0;i<n;i++){
          var t=Math.min(1,Math.max(0, pr.u*1.25-offs[i].lag));
          var p=bez(HOP[h], u0+(u1-u0)*t);
          dots[i].setAttribute('cx',(p[0]+offs[i].x*spread).toFixed(1));
          dots[i].setAttribute('cy',(p[1]+offs[i].y*spread).toFixed(1));
        }
      },
      complete:function(){ if(done) done(); } });
  }

  // runStep(i): play step i's motion; the scene is already parked at i-1
  function runStep(i){
    setCaption(i);
    if(i===0){
      var len=tube.getTotalLength();
      tube.setAttribute('stroke-dasharray',len); tube.setAttribute('stroke-dashoffset',len);
      groups.gTube.style.opacity='1';
      $('vaclab').style.opacity='0';
      reg({ targets:tube, strokeDashoffset:[len,0], duration:800, easing:'easeInOutSine',
            complete:function(){ tube.removeAttribute('stroke-dasharray'); tube.removeAttribute('stroke-dashoffset'); } });
      reg({ targets:$('vaclab'), opacity:[0,1], duration:400, delay:600,
            complete:function(){ $('vaclab').style.opacity=''; } });
      reg({ targets:groups.gCath, opacity:[0,1], duration:350, delay:500 });
      dynGroups.forEach(function(g){ g.style.opacity='0'; });
      groups.gDyn.style.opacity='1';
      reg({ targets:dynGroups, opacity:[0,1], duration:320, delay:anime.stagger(90,{start:850}) });
      reg({ targets:groups.gAnode, opacity:[0,1], duration:350, delay:1500 });
      reg({ targets:groups.gChain, opacity:[0,1], duration:450, delay:1750 });
      reg({ targets:groups.gPanels, opacity:[0,1], duration:450, delay:2100 });
    }
    if(i===1){
      photon.style.opacity='1';
      reg({ targets:photon, translateX:[-280,0], duration:950, easing:'linear' });
      later(function(){ flash(0,false); }, 930);
    }
    if(i===2){
      flash(0,false);
      reg({ targets:photon, opacity:[1,0], duration:150, easing:'linear' });
      later(function(){ fly(0,1,0,0.02,0.20,520,'easeOutQuad'); }, 120);
      later(function(){ bumpCount('1'); }, 250);
      reg({ targets:$('cathnote'), opacity:[0,1], duration:350, delay:300 });
    }
    if(i===3){
      reg({ targets:$('dvlbl'), opacity:[0,1], duration:320 });
      fly(0,1,0,0.20,0.75,1250,'easeInCubic');
      reg({ targets:$('cathnote'), opacity:[1,0], duration:320, delay:750 });
    }
    if(i===4){
      fly(0,1,0,0.75,1,240,'easeInQuad',function(){
        flash(1,false); bumpCount('4');
        fly(1,4,8,0,1,820,'easeInQuad',function(){
          flash(2,false); bumpCount('16');
          reg({ targets:$('deltaNote'), opacity:[0,1], duration:400 });
          fly(2,16,13,0,1,820,'easeInQuad');
        });
      });
    }
    if(i===5){
      flash(3,false); bumpCount('64');
      fly(3,24,16,0,1,720,'easeInQuad',function(){
        flash(4,false); bumpCount('256');
        fly(4,32,20,0,1,720,'easeInQuad',function(){
          flash(5,false); bumpCount('1,024');
          fly(5,40,24,0,1,720,'easeInQuad',function(){
            flash(6,false); bumpCount('4,096');
            fly(6,40,26,0,0.55,800,'easeOutQuad');
          });
        });
      });
    }
    if(i===6){
      fly(6,40,26,0.55,1,520,'easeInQuad',function(){
        flash(7,true); hideDots();
        pulse.style.opacity='1';
        var plen=pulse.getTotalLength();
        pulse.setAttribute('stroke-dasharray',plen); pulse.setAttribute('stroke-dashoffset',plen);
        reg({ targets:pulse, strokeDashoffset:[plen,0], duration:950, easing:'easeOutCubic',
              complete:function(){ pulse.removeAttribute('stroke-dasharray'); pulse.removeAttribute('stroke-dashoffset'); } });
        reg({ targets:$('gSig'), opacity:[0,1], duration:400, delay:100 });
        reg({ targets:$('gProps'), opacity:[0,1], duration:500, delay:500 });
      });
    }
  }

  // central step switch. animateIn=true: park at i-1 instantly, then play step i.
  // animateIn=false: park instantly at the end state of step i.
  function go(i, animateIn){
    i = Math.max(0, Math.min(N-1, i));
    stopAll();
    if(animateIn){ parkScene(i-1); runStep(i); }
    else parkScene(i);
    cur = i;
    chips.forEach(function(c,k){ c.classList.toggle('active', k===cur); });
    try { parent.postMessage({ animState: { step: cur+1, total: N } }, '*'); } catch(e) {}
  }

  // ---------------- controls ----------------
  var playing=false, autoTimer=null;
  var DUR=[5200,4600,4800,5200,5800,7000,6200];
  function stopAuto(){ if(autoTimer){ clearTimeout(autoTimer); autoTimer=null; } }
  function stopPlay(){ playing=false; $('play').innerHTML='&#9654;'; stopAuto(); }
  function schedule(){
    stopAuto();
    autoTimer=setTimeout(function(){
      if(!playing) return;
      if(cur<N-1){ go(cur+1,true); schedule(); } else stopPlay();
    }, DUR[cur]);
  }
  function startPlay(){
    playing=true; $('play').innerHTML='&#10074;&#10074;';
    if(cur>=N-1) go(0,true);
    schedule();
  }

  var chipsBox=$('chips'), chips=[];
  STEPS.forEach(function(s,k){
    var b=document.createElement('button');
    b.className='chip'; b.type='button'; b.textContent=k+1;
    b.title=s.name; b.setAttribute('aria-label','step '+(k+1)+': '+s.name);
    b.addEventListener('click', function(){ stopPlay(); go(k,true); });
    chipsBox.appendChild(b); chips.push(b);
  });

  $('next').addEventListener('click', function(){ stopPlay(); if(cur<N-1) go(cur+1,true); });
  $('prev').addEventListener('click', function(){ stopPlay(); if(cur>0) go(cur-1,false); });
  $('play').addEventListener('click', function(){ playing? stopPlay() : startPlay(); });
  $('replay').addEventListener('click', function(){ stopPlay(); go(0,true); startPlay(); });
  document.addEventListener('keydown', function(e){
    if(e.key==='ArrowRight'){ stopPlay(); if(cur<N-1) go(cur+1,true); }
    if(e.key==='ArrowLeft'){ stopPlay(); if(cur>0) go(cur-1,false); }
  });

  // deck-step API
  addEventListener('message', function(e){
    var d=e && e.data;
    if(!d || !d.anim) return;
    if(d.anim==='next'){ stopPlay(); if(cur<N-1) go(cur+1,true); }
    else if(d.anim==='prev'){ stopPlay(); if(cur>0) go(cur-1,false); }
    else if(d.anim==='goto'){ stopPlay(); var k=parseInt(d.step,10); if(isFinite(k)) go(k-1,false); }
  });

  // lock body height to the real iframe height
  function fit(){ document.body.style.height = window.innerHeight + 'px'; }
  window.addEventListener('resize', fit); fit();

  // ---------------- boot: park at step 1, no motion ----------------
  var q=location.search.match(/[?&]shot=([a-z\-]+)/);
  var hs=(location.hash||'').match(/s(\d+)/);
  var start=0;
  if(q){ STEPS.forEach(function(s,k){ if(s.id===q[1]) start=k; }); }
  else if(hs){ start=Math.max(0,Math.min(N-1,parseInt(hs[1],10)-1)); }
  go(start,false);
})();
</script>
<script>
(function () {
  var d = document.documentElement;
  function apply(t) { d.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light'); }
  var m = (location.search.match(/[?&]theme=(dark|light)/) || [])[1];
  apply(m || 'light');
  addEventListener('message', function (e) {
    if (e && e.data && (e.data.theme === 'dark' || e.data.theme === 'light')) apply(e.data.theme);
  });
})();
</script>
</body>
