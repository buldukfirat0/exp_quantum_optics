<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNSPD</title>
<style>
  :root {
    --bg: #e9e6df;
    --panel: #f4f2ec;
    --ink: #23272e;
    --muted: #5d6570;
    --line: #c6c0b2;
    --e: #2d5fb8;         /* quasiparticle blue */
    --pair: #1f7a5c;      /* Cooper pair / supercurrent green */
    --sflow: #2aa676;     /* bright supercurrent */
    --photon: #b7791f;    /* amber */
    --term: #0f766e;      /* teal terms */
    --signal: #15803d;    /* green output */
    --field: #6d28d9;     /* violet bias */
    --hot: #c02626;       /* normal / hotspot red */
    --edge: #5a5346;
    --wire: #b7c2cc;      /* metallic wire body */
    --wiretop: #cdd7df;
  }
  :root[data-theme="dark"] {
    --bg: #171b20;
    --panel: #262b31;
    --ink: #ebe7dd;
    --muted: #a1abb5;
    --line: #3b414a;
    --e: #6ea3f2;
    --pair: #46c99a;
    --sflow: #4bd6a0;
    --photon: #e3a94e;
    --term: #37c6b8;
    --signal: #51c77d;
    --field: #ab8ffb;
    --hot: #f06b6b;
    --edge: #8a8272;
    --wire: #9aa6b1;
    --wiretop: #b6c1cb;
  }
  html, body { transition: background-color .3s ease; }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    height: 100vh; overflow: hidden; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start;
    padding: 10px 12px 12px;
  }
  .bar { width: min(1240px, 97vw); display: flex; align-items: center; gap: 12px; padding: 4px 6px 8px; }
  .bar h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .bar .spacer { margin-left: auto; }
  .bar button {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 15px; font-size: 15px; cursor: pointer;
  }
  .bar button:hover { border-color: var(--photon); }
  .bar button:focus-visible { outline: 2px solid var(--photon); outline-offset: 2px; }
  .controls button { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .controls .chip { min-width: 34px; padding: 7px 0; text-align: center; font-size: 14px; }
  .controls .chip.active { border-color: var(--photon); color: var(--photon); font-weight: 700; }

  svg { width: min(1240px, 97vw); height: auto; max-height: calc(100vh - 110px); display: block; }

  .cap   { font-size: 25px; font-weight: 700; fill: var(--ink); }
  .cap2  { font-size: 16px; fill: var(--muted); }
  .face  { font-size: 18px; font-weight: 700; fill: var(--ink); }
  .bom   { font-size: 16px; fill: var(--ink); }
  .term  { font-size: 16px; font-weight: 600; fill: var(--term); }
  .lbl   { font-size: 15px; fill: var(--muted); }
  .small { font-size: 14px; fill: var(--muted); }
  .badge { font-size: 18px; font-weight: 700; }
  .volt  { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
           font-size: 15px; font-weight: 600; fill: var(--field); }
  .pk    { font-size: 15px; fill: var(--muted); }
  .pv    { font-size: 15px; font-weight: 700; fill: var(--ink); }

  .fade { opacity: 0; transition: opacity .5s ease; }
  .fade.on { opacity: 1; }
  .grow { opacity: 0; transform: translateY(-22px); transition: opacity .5s ease, transform .5s ease; }
  .grow.on { opacity: 1; transform: translateY(0); }
  body.instant .fade, body.instant .grow { transition: none !important; }
</style>
</head>
<body>

<div class="bar">
  <h1>Superconducting nanowire single-photon detector (SNSPD)</h1>
  <span class="spacer"></span>
  <button id="replay" type="button">Replay</button>
</div>
<div class="bar controls" role="group" aria-label="step controls">
  <button id="prev" type="button" aria-label="previous step">&#9664;</button>
  <button id="play" type="button" aria-label="pause or play">&#10074;&#10074;</button>
  <button id="next" type="button" aria-label="next step">&#9654;</button>
  <span id="chips" style="display:flex; gap:6px; flex-wrap:wrap;"></span>
</div>

<svg viewBox="0 0 1280 730" role="img" aria-label="Superconducting nanowire single-photon detector, built layer by layer then operated">

  <text id="cap"  class="cap"  x="640" y="40" text-anchor="middle"></text>
  <text id="cap2" class="cap2" x="640" y="68" text-anchor="middle"></text>

  <!-- temperature badge -->
  <g id="tempbadge" class="fade">
    <rect x="36" y="90" width="272" height="60" rx="10" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/>
    <text class="badge" x="54" y="120" fill="var(--term)">T = 0.8 to 4 K</text>
    <text class="small" x="54" y="141">below T<tspan baseline-shift="sub" font-size="10">c</tspan> (critical temperature)</text>
  </g>

  <!-- ============ device (top-down): substrate, film, then the meander wire ============ -->

  <!-- substrate -->
  <g id="Lsub" class="grow">
    <rect x="350" y="160" width="562" height="410" rx="12" fill="#c7c1b3" stroke="var(--edge)" stroke-width="1.4"/>
    <text class="face" x="631" y="556" text-anchor="middle" fill="#5a5346" stroke="#c7c1b3" stroke-width="3.5" paint-order="stroke">substrate</text>
  </g>

  <!-- thin superconducting film (full sheet, before patterning) -->
  <g id="Lfilm" class="grow">
    <rect x="368" y="180" width="526" height="356" rx="8" fill="#cdd9e0" stroke="var(--edge)" stroke-width="1.2"/>
  </g>
  <g id="labFilm" class="fade">
    <text class="lbl" x="631" y="204" text-anchor="middle" fill="var(--pair)" font-weight="700">superconducting film, a few nm thick (niobium nitride)</text>
  </g>

  <!-- the meander nanowire -->
  <g id="meander" class="fade">
    <path id="mpath"  fill="none" stroke="var(--edge)"    stroke-width="27" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="mpath2" fill="none" stroke="var(--wire)"    stroke-width="21" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="mpath3" fill="none" stroke="var(--wiretop)" stroke-width="8"  stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  </g>
  <g id="meanderLbl" class="fade">
    <text class="lbl" x="631" y="150" text-anchor="middle" fill="var(--ink)" font-weight="700">one nanowire, about 100 nm wide, folded back and forth</text>
  </g>

  <!-- contacts at the two wire ends -->
  <g id="contacts" class="fade">
    <rect x="366" y="199" width="16" height="22" rx="2" fill="#4a4a4a"/>
    <rect x="366" y="499" width="16" height="22" rx="2" fill="#4a4a4a"/>
  </g>

  <!-- supercurrent tokens along the wire (built in JS) -->
  <g id="flowG"></g>
  <!-- hotspot + quasiparticles at the struck segment -->
  <ellipse id="hspot" class="fade" cx="630" cy="310" rx="6" ry="6" fill="var(--hot)" fill-opacity="0.85"/>
  <g id="quasi"></g>

  <!-- incident photon -->
  <g id="photon" class="fade">
    <path d="M 0,0 q 10,15 0,30 q -10,15 0,30 q 10,15 0,30 q -10,15 0,30"
          fill="none" stroke="var(--photon)" stroke-width="3" stroke-linecap="round"/>
    <path d="M -6,116 L 0,130 L 6,116" fill="none" stroke="var(--photon)" stroke-width="3" stroke-linejoin="round"/>
    <text class="lbl" x="14" y="14" fill="var(--photon)" font-weight="700">photon h&nu;</text>
  </g>

  <!-- ============ bias current source + parallel readout (left) ============ -->
  <g id="circuit" class="fade">
    <!-- top and bottom rails from the two contacts -->
    <path d="M 382,210 L 170,210" fill="none" stroke="var(--field)" stroke-width="2.4"/>
    <path d="M 382,510 L 170,510" fill="none" stroke="var(--field)" stroke-width="2.4"/>

    <!-- bias current source branch (x=300) -->
    <path d="M 300,210 L 300,343" fill="none" stroke="var(--field)" stroke-width="2.4"/>
    <circle cx="300" cy="360" r="17" fill="var(--panel)" stroke="var(--field)" stroke-width="2.2"/>
    <path d="M 300,372 L 300,349" fill="none" stroke="var(--field)" stroke-width="2.2"/>
    <path d="M 294,356 L 300,347 L 306,356" fill="none" stroke="var(--field)" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M 300,377 L 300,510" fill="none" stroke="var(--field)" stroke-width="2.4"/>
    <text class="volt" x="322" y="366" fill="var(--field)">I<tspan baseline-shift="sub" font-size="11">b</tspan></text>
    <text class="small" x="300" y="190" text-anchor="middle" fill="var(--field)">bias current source</text>

    <!-- readout branch (x=170): the diverted current flows through the load resistor R_L -->
    <path d="M 170,210 L 170,300" fill="none" stroke="var(--field)" stroke-width="2.4"/>
    <path d="M 170,300 L 170,306 L 161,310 L 179,318 L 161,326 L 179,334 L 161,342 L 179,350 L 170,354 L 170,360"
          fill="none" stroke="var(--field)" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M 170,360 L 170,510" fill="none" stroke="var(--field)" stroke-width="2.4"/>
    <text class="volt" x="192" y="326" fill="var(--field)">R<tspan baseline-shift="sub" font-size="11">L</tspan></text>
    <text class="small" x="192" y="344" fill="var(--muted)">load resistor</text>

    <!-- amplifier (triangle) reads the voltage across R_L and sends it out -->
    <path d="M 170,300 L 118,300 L 118,318" fill="none" stroke="var(--field)" stroke-width="1.6"/>
    <path d="M 170,360 L 118,360 L 118,342" fill="none" stroke="var(--field)" stroke-width="1.6"/>
    <path d="M 118,312 L 118,348 L 86,330 Z" fill="var(--panel)" stroke="var(--field)" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M 86,330 L 58,330" fill="none" stroke="var(--field)" stroke-width="1.8"/>
    <path d="M 66,325 L 56,330 L 66,335" fill="none" stroke="var(--field)" stroke-width="1.8" stroke-linejoin="round"/>
    <text class="small" x="102" y="376" text-anchor="middle" fill="var(--field)">amplifier</text>
    <text class="small" x="60" y="320" text-anchor="middle" fill="var(--field)">V<tspan baseline-shift="sub" font-size="10">out</tspan></text>
  </g>
  <!-- diverted-current tokens through the readout branch (built in JS) -->
  <g id="rflowG"></g>

  <!-- supercurrent / quasiparticle legend (bottom-left, enlarged) -->
  <g id="legend" class="fade">
    <g fill="var(--pair)" stroke="var(--pair)"><line x1="40" y1="604" x2="56" y2="604" stroke-width="3"/><circle cx="40" cy="604" r="7.5"/><circle cx="56" cy="604" r="7.5"/></g>
    <text x="74" y="610" font-size="18" fill="var(--pair)" font-weight="700">Cooper pair: the supercurrent carrier</text>
    <text x="40" y="636" font-size="17" fill="var(--muted)">two electrons bound below T<tspan baseline-shift="sub" font-size="11">c</tspan></text>
  </g>
  <g id="legendQ" class="fade">
    <circle cx="48" cy="666" r="7.5" fill="var(--e)"/>
    <text x="74" y="672" font-size="18" fill="var(--e)" font-weight="700">quasiparticle: a single broken-pair carrier</text>
    <text x="40" y="698" font-size="17" fill="var(--muted)">a photon breaks pairs into quasiparticles</text>
  </g>

  <!-- ============ right column: bill of materials ============ -->
  <g id="bom" class="fade">
    <rect x="953" y="140" width="312" height="132" rx="12" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/>
    <text x="974" y="172" font-size="20" font-weight="700" fill="var(--term)">device stack, top to bottom</text>
    <g id="bom1" class="fade">
      <rect x="974" y="188" width="27" height="27" fill="var(--wire)" stroke="var(--edge)" stroke-width="1"/>
      <text x="1013" y="209" font-size="19" fill="var(--ink)">superconducting nanowire</text>
    </g>
    <g id="bom2" class="fade">
      <rect x="974" y="230" width="27" height="27" fill="#c7c1b3" stroke="var(--edge)" stroke-width="1"/>
      <text x="1013" y="251" font-size="19" fill="var(--ink)">substrate: support wafer</text>
    </g>
  </g>

  <!-- output voltage scope -->
  <g id="scope" class="fade">
    <text class="lbl" x="1090" y="300" text-anchor="middle">output voltage over time</text>
    <rect x="940" y="312" width="300" height="228" rx="10" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/>
    <line x1="966" y1="510" x2="1216" y2="510" stroke="var(--muted)" stroke-width="1.8"/>
    <line x1="966" y1="510" x2="966" y2="336" stroke="var(--muted)" stroke-width="1.8"/>
    <text class="small" x="974" y="350">V</text>
    <text class="small" x="1212" y="530" text-anchor="end">time</text>
  </g>
  <path id="pulse" class="fade" fill="none" stroke="var(--signal)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"
        d="M 966,510 L 1006,510 L 1016,352 C 1064,352 1120,502 1180,508 L 1216,510"/>
  <circle id="beam" class="fade" r="6" fill="var(--signal)"/>
  <text id="traceNote" class="fade small" x="1090" y="562" text-anchor="middle" fill="var(--signal)" font-weight="700">same height: not photon-number resolving</text>

  <!-- SNSPD properties, revealed at the last step (PMT-style spec panel) -->
  <g id="props" class="fade">
    <rect x="502" y="586" width="763" height="128" rx="10" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/>
    <text x="520" y="614" font-size="18" font-weight="700" fill="var(--term)">SNSPD properties</text>
    <!-- column 1 -->
    <text class="pk" x="520" y="652">efficiency &#951;: <tspan class="pv">up to &gt;90%</tspan></text>
    <text class="pk" x="520" y="690">dark counts: <tspan class="pv">very low, few /s</tspan></text>
    <!-- column 2 -->
    <text class="pk" x="772" y="652">dead time: <tspan class="pv">tens of ns</tspan></text>
    <text class="pk" x="772" y="690">timing jitter: <tspan class="pv">&lt; 50 ps</tspan></text>
    <!-- column 3 -->
    <text class="pk" x="1022" y="652">photon number: <tspan class="pv">not resolved</tspan></text>
    <text class="pk" x="1022" y="690">temperature: <tspan class="pv">0.8 to 4 K</tspan></text>
  </g>

</svg>

<script>

<script>
(function(){
  "use strict";
  const SVGNS = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);
  const show = (el,on)=> el && el.classList.toggle('on', !!on);

  // ---- build the meander path ----
  const mpath = $('mpath');
  const D = "M380,210 L880,210 L880,310 L380,310 L380,410 L880,410 L880,510 L380,510";
  $('mpath').setAttribute('d', D);
  $('mpath2').setAttribute('d', D);
  $('mpath3').setAttribute('d', D);
  const LEN = mpath.getTotalLength();

  // struck point = middle of run 2
  const sHot = 850;                       // arclength along the wire
  const struck = mpath.getPointAtLength(sHot);
  $('hspot').setAttribute('cx', struck.x.toFixed(1));
  $('hspot').setAttribute('cy', struck.y.toFixed(1));

  // ---- readout diversion path (out of the wire, through the readout, back) ----
  const rpathD = "M382,210 L170,210 L170,510 L382,510";
  const rpath = document.createElementNS(SVGNS,'path');
  rpath.setAttribute('d', rpathD); rpath.setAttribute('fill','none'); rpath.setAttribute('stroke','none');
  document.querySelector('svg').appendChild(rpath);
  const RLEN = rpath.getTotalLength();

  // ---- supercurrent tokens (Cooper pairs) riding the wire ----
  const NTOK = 20, flowG = $('flowG'), toks = [];
  function makeTok(container, colorVar){
    const g = document.createElementNS(SVGNS,'g');
    const bond = document.createElementNS(SVGNS,'line'); bond.setAttribute('stroke','var('+colorVar+')'); bond.setAttribute('stroke-width','2.4');
    const c1 = document.createElementNS(SVGNS,'circle'); c1.setAttribute('r','4'); c1.setAttribute('fill','var('+colorVar+')');
    const c2 = document.createElementNS(SVGNS,'circle'); c2.setAttribute('r','4'); c2.setAttribute('fill','var('+colorVar+')');
    g.appendChild(bond); g.appendChild(c1); g.appendChild(c2); container.appendChild(g);
    return {g,bond,c1,c2,ph:0};
  }
  for (let k=0;k<NTOK;k++){ const t=makeTok(flowG,'--pair'); t.ph=k/NTOK; toks.push(t); }
  const NR = 10, rflowG = $('rflowG'), rtoks = [];
  for (let k=0;k<NR;k++){ const t=makeTok(rflowG,'--sflow'); t.ph=k/NR; rtoks.push(t); }

  // quasiparticle dots around the struck point
  const qg = $('quasi');
  const offs = [[-22,-7],[-8,6],[10,-6],[22,7],[-30,4],[30,-2],[2,-14],[-14,13],[16,14],[-2,0]];
  const qdots = offs.map(o=>{
    const c = document.createElementNS(SVGNS,'circle');
    c.setAttribute('cx', struck.x+o[0]); c.setAttribute('cy', struck.y+o[1]);
    c.setAttribute('r','5'); c.setAttribute('fill','var(--e)'); c.setAttribute('opacity','0');
    qg.appendChild(c); return c;
  });

  // ---- animation state (eased each frame) ----
  const S = { flow:0, flowT:0, rflow:0, rflowT:0, hot:0, hotT:0, quasi:0, quasiT:0, photonY:90, photonYT:90 };
  const HALF = 10.5;                       // wire half-width
  const WIN = 34;                          // half-window of the hotspot along the wire
  let mode = 'off', fc = 0;

  function tangent(path, s){
    const L = path.getTotalLength();
    const a = path.getPointAtLength(Math.max(0,s-1));
    const b = path.getPointAtLength(Math.min(L, s+1));
    return Math.atan2(b.y-a.y, b.x-a.x);
  }
  function place(tok, pt, ang, off){
    const dx=Math.cos(ang), dy=Math.sin(ang), px=-dy, py=dx, ox=px*off, oy=py*off;
    const ax=pt.x+dx*3.5+ox, ay=pt.y+dy*3.5+oy, bx=pt.x-dx*3.5+ox, by=pt.y-dy*3.5+oy;
    tok.c1.setAttribute('cx',ax.toFixed(1)); tok.c1.setAttribute('cy',ay.toFixed(1));
    tok.c2.setAttribute('cx',bx.toFixed(1)); tok.c2.setAttribute('cy',by.toFixed(1));
    tok.bond.setAttribute('x1',ax.toFixed(1)); tok.bond.setAttribute('y1',ay.toFixed(1));
    tok.bond.setAttribute('x2',bx.toFixed(1)); tok.bond.setAttribute('y2',by.toFixed(1));
  }

  function frame(){
    S.flow  += (S.flowT  - S.flow )*0.12;
    S.rflow += (S.rflowT - S.rflow)*0.12;
    S.hot   += (S.hotT   - S.hot  )*0.14;
    S.quasi += (S.quasiT - S.quasi)*0.14;
    S.photonY += (S.photonYT - S.photonY)*0.16;

    $('hspot').setAttribute('rx', (7 + S.hot*24).toFixed(1));
    $('hspot').setAttribute('ry', (5 + S.hot*(HALF-1)).toFixed(1));

    qdots.forEach((c,k)=> c.setAttribute('opacity', (S.quasi*(0.62+0.38*Math.sin(fc*0.12+k))).toFixed(2)) );
    $('photon').setAttribute('transform', 'translate('+struck.x.toFixed(1)+','+S.photonY.toFixed(1)+')');

    for (let k=0;k<toks.length;k++){
      const t=toks[k];
      t.ph=(t.ph + S.flow*0.0016) % 1;
      const s=t.ph*LEN, pt=mpath.getPointAtLength(s), ang=tangent(mpath,s);
      const d=s-sHot; let off=0, vis=1;
      if (mode==='crowd' || mode==='blocked' || mode==='divert'){
        if (Math.abs(d) < WIN){
          const f = 1 - Math.abs(d)/WIN;
          off = (k%2? 1:-1) * (HALF-2) * f;
          if (mode!=='crowd') vis = 0;      // once the full width is normal, nothing crosses
        }
      }
      t.g.setAttribute('opacity', (((mode==='blocked'||mode==='divert')? 0.32 : 1) * vis).toFixed(2));
      place(t, pt, ang, off);
    }
    for (let k=0;k<rtoks.length;k++){
      const t=rtoks[k];
      t.ph=(t.ph + S.rflow*0.0016) % 1;
      const s=t.ph*RLEN, pt=rpath.getPointAtLength(s), ang=tangent(rpath,s);
      t.g.setAttribute('opacity', S.rflow>0.05? '1':'0');
      place(t, pt, ang, 0);
    }

    fc++; requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- steps ----------
  const STEPS = [
    { cap:"1. Start with the substrate.",
      cap2:"A flat support wafer of silicon or sapphire. Every layer is grown on top of it.",
      on:['Lsub','bom','bom2'] },
    { cap:"2. Deposit a thin superconducting film.",
      cap2:"A film only a few nanometers thick, for example niobium nitride, so thin that one photon disturbs its whole thickness.",
      on:['Lsub','Lfilm','labFilm','bom','bom2','bom1'] },
    { cap:"3. Pattern the film into one nanowire, folded back and forth.",
      cap2:"Etch the film into one wire about 100 nanometers wide, folded back and forth to cover the detection area.",
      on:['Lsub','meander','meanderLbl','bom','bom2','bom1'] },
    { cap:"4. Attach the contacts, the bias current source, and the readout.",
      cap2:"One branch drives a constant bias current in. The parallel branch is the readout: a load resistor and an amplifier that read the voltage pulse out.",
      on:['Lsub','meander','contacts','circuit','bom','bom2','bom1'] },
    { cap:"5. Cool below the critical temperature; Cooper pairs form.",
      cap2:"Cooled to 0.8 to 4 kelvin the film superconducts: electrons bind in pairs that carry current at zero resistance.",
      on:['Lsub','meander','contacts','circuit','bom','bom2','bom1','tempbadge','legend'] },
    { cap:"6. The bias current flows through the wire at zero resistance.",
      cap2:"The Cooper pairs carry the bias current, set just below the critical current. No voltage appears across the wire.",
      on:['Lsub','meander','contacts','circuit','bom','bom2','bom1','tempbadge','legend'],
      mode:'flow', flow:1 },
    { cap:"7. One photon is absorbed in a segment and breaks pairs.",
      cap2:"The photon energy breaks Cooper pairs into quasiparticles.",
      on:['Lsub','meander','contacts','circuit','bom','bom2','bom1','tempbadge','legend','legendQ','photon'],
      mode:'flow', flow:1, photon:true, quasi:1 },
    { cap:"8. The broken-pair region turns resistive: the hotspot.",
      cap2:"Where the pairs are gone that small region can no longer superconduct and gains resistance. This region is the hotspot.",
      on:['Lsub','meander','contacts','circuit','bom','bom2','bom1','tempbadge','legend','legendQ'],
      mode:'flow', flow:1, quasi:1, hot:0.4 },
    { cap:"9. The supercurrent is forced around the hotspot.",
      cap2:"The current cannot cross the hotspot, so it crowds into the thin sidewalks, past the critical current density there.",
      on:['Lsub','meander','contacts','circuit','bom','bom2','bom1','tempbadge','legend','legendQ'],
      mode:'crowd', flow:1, quasi:0.5, hot:0.62 },
    { cap:"10. The current diverts into the readout: one voltage pulse.",
      cap2:"The bias current flows into the readout as a fast pulse, then the wire cools and superconducts again for the next photon.",
      on:['Lsub','meander','contacts','circuit','bom','bom2','bom1','tempbadge','legend','legendQ','scope','pulse','beam','traceNote','props'],
      mode:'divert', flow:1, rflow:1, quasi:0.2, hot:1, pulse:true }
  ];

  const ALL = ['Lsub','Lfilm','labFilm','meander','meanderLbl','contacts','circuit','tempbadge','legend','legendQ',
               'photon','bom','bom1','bom2','scope','pulse','beam','traceNote','props'];

  let i=0, playing=true, timer=null, pulseAnim=null;

  const chipsBox = $('chips');
  STEPS.forEach((_,k)=>{
    const b=document.createElement('button'); b.className='chip'; b.type='button'; b.textContent=k+1;
    b.addEventListener('click', ()=>{ stop(); go(k); });
    chipsBox.appendChild(b);
  });
  const chips = Array.from(chipsBox.children);

  function runPulse(){
    if (!window.anime) return;
    const path=$('pulse'), tot=path.getTotalLength(), beam=$('beam');
    if (pulseAnim) pulseAnim.pause();
    const st={s:0};
    pulseAnim = anime({ targets:st, s:tot, duration:1500, easing:'easeInOutSine', loop:true,
      update:function(){ const p=path.getPointAtLength(st.s); beam.setAttribute('cx',p.x); beam.setAttribute('cy',p.y); } });
  }

  function render(step){
    const s = STEPS[step];
    $('cap').textContent=s.cap; $('cap2').textContent=s.cap2;
    const onset = new Set(s.on||[]);
    ALL.forEach(id=> show($(id), onset.has(id)));

    mode = s.mode || 'off';
    // Cooper pairs exist only once the wire is cold (step 5 onward); the readout stream only while diverting
    flowG.style.display  = (step>=4) ? '' : 'none';
    rflowG.style.display = (mode==='divert') ? '' : 'none';
    S.flowT  = s.flow  || 0;
    S.rflowT = s.rflow || 0;
    S.hotT   = (s.hot!=null)   ? s.hot   : 0;
    S.quasiT = (s.quasi!=null) ? s.quasi : 0;
    S.photonYT = s.photon ? 175 : 90;
    if (s.photon) S.photonY = 90;
    $('hspot').classList.toggle('on', (S.hotT>0));

    if (s.pulse) runPulse(); else if (pulseAnim){ pulseAnim.pause(); pulseAnim=null; $('beam').classList.remove('on'); }

    chips.forEach((c,k)=> c.classList.toggle('active', k===step));

    try { parent.postMessage({ animState: { step: step+1, total: STEPS.length } }, '*'); } catch (err) {}
  }

  function go(n){ i=Math.max(0,Math.min(STEPS.length-1,n)); render(i); }
  function goInstant(n){
    // park at the end state of step n: no CSS transitions, eased values snapped to their targets
    i=Math.max(0,Math.min(STEPS.length-1,n));
    document.body.classList.add('instant');
    render(i);
    S.flow=S.flowT; S.rflow=S.rflowT; S.hot=S.hotT; S.quasi=S.quasiT; S.photonY=S.photonYT;
    void document.body.offsetWidth;   // flush styles while transitions are disabled
    document.body.classList.remove('instant');
  }
  function next(){ if (i<STEPS.length-1) go(i+1); else stop(); }
  function stopTimer(){ if (timer){ clearTimeout(timer); timer=null; } }
  function auto(){ stopTimer(); timer=setTimeout(()=>{ if (playing){ if (i<STEPS.length-1){ next(); auto(); } else stop(); } }, 3600); }
  function play(){ playing=true; $('play').innerHTML='&#10074;&#10074;'; if (i>=STEPS.length-1) go(0); auto(); }
  function stop(){ playing=false; $('play').innerHTML='&#9654;'; stopTimer(); }

  $('next').addEventListener('click', ()=>{ stop(); next(); });
  $('prev').addEventListener('click', ()=>{ stop(); go(i-1); });
  $('play').addEventListener('click', ()=>{ playing? stop() : play(); });
  $('replay').addEventListener('click', ()=>{ go(0); play(); });
  document.addEventListener('keydown', e=>{
    if (e.key==='ArrowRight'){ stop(); next(); }
    if (e.key==='ArrowLeft'){ stop(); go(i-1); }
  });

  // deck-step API (called from the message listener in the theme script below)
  window.__anim = {
    next: function(){ stop(); next(); },
    prev: function(){ stop(); go(i-1); },
    goto: function(k){ k=parseInt(k,10); if (!Number.isFinite(k)) return; stop(); goInstant(k-1); }
  };

  // boot: no autoplay, park instantly (hash = 0-based step index for screenshots)
  const h = parseInt((location.hash||'').slice(1),10);
  stop();
  if (Number.isFinite(h)){ goInstant(h); } else { goInstant(0); }
})();
</script>
<script>
/* theme sync: read ?theme=dark|light from the URL, and accept postMessage from the deck */
(function () {
  var d = document.documentElement;
  function apply(t) { d.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light'); }
  var m = (location.search.match(/[?&]theme=(dark|light)/) || [])[1];
  apply(m || 'light');
  addEventListener('message', function (e) {
    if (e && e.data && (e.data.theme === 'dark' || e.data.theme === 'light')) apply(e.data.theme);
  });
  addEventListener('message', function (e) {
    var d = e && e.data;
    if (!d || !d.anim || !window.__anim) return;
    if (d.anim === 'next') window.__anim.next();
    else if (d.anim === 'prev') window.__anim.prev();
    else if (d.anim === 'goto') window.__anim.goto(d.step);
  });
})();
</script>
</body>
</html>
