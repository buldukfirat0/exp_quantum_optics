<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPAD — from p-type to Geiger mode</title>
<style>
  :root {
    --bg: #e9e6df;
    --panel: #f4f2ec;
    --ink: #23272e;
    --muted: #5d6570;
    --line: #c6c0b2;
    --elec: #2d5fb8;
    --hole: #c0392b;
    --photon: #b7791f;
    --term: #0f766e;
    --signal: #15803d;
    --hot: #c02626;
    --field: #6d28d9;
    --edge: #5a5346;
    --pface: #ecd6bf;
    --nface: #cbdce8;
    --deplface: #d9d3c4;
    --geizone: #dfe8db;
  }
  :root[data-theme="dark"] {
    --bg: #171b20; --panel: #262b31; --ink: #ebe7dd; --muted: #a1abb5; --line: #3b414a;
    --elec: #6ea3f2; --hole: #f0736a; --photon: #e3a94e; --term: #37c6b8;
    --signal: #51c77d; --hot: #f06b6b; --field: #ab8ffb; --edge: #7d766a;
    --pface: #46372a; --nface: #2b3d4f; --deplface: #383d43; --geizone: #22301f;
  }
  html, body { height: 100%; transition: background-color .3s ease; }
  * { box-sizing: border-box; margin: 0; }
  /* full-height grid: title, controls, main (fills), bottom bar.
     height:100% (not 100vh) so it fills the deck iframe exactly and the
     bottom bar can never overlap the panels. */
  body {
    background: var(--bg); color: var(--ink);
    font-family: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
    display: grid; grid-template-rows: auto auto minmax(0,1fr) auto;
    padding: 8px 12px 10px; gap: 2px;
  }
  .bar { width: min(1320px, 98vw); margin: 0 auto; display: flex; align-items: center; gap: 10px; padding: 3px 6px 6px; }
  .bar h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
  .bar .spacer { margin-left: auto; }
  .bar button {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 13px; font-size: 14px; cursor: pointer; font-family: inherit;
  }
  .bar button:hover { border-color: var(--photon); }
  .bar button:disabled { opacity: .4; cursor: not-allowed; }
  .controls button { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .controls .chip { min-width: 30px; padding: 6px 0; text-align: center; font-size: 13px; }
  .controls .chip.active { border-color: var(--photon); color: var(--photon); font-weight: 700; }

  .main {
    width: min(1320px, 98vw); margin: 0 auto; min-height: 0;
    display: grid; grid-template-columns: 1.42fr 1fr; gap: 18px; align-items: stretch;
  }
  .left { min-width: 0; min-height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  /* fill the cell and letterbox uniformly (meet) so the device can never overflow */
  .left svg { width: 100%; height: 100%; }
  .right {
    min-width: 320px; max-width: 480px; min-height: 0; overflow: hidden;
    display: grid; grid-template-rows: 44px minmax(0,1.15fr) minmax(0,0.95fr) auto;
    gap: 8px; padding: 2px;
  }
  .rp { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  /* the explanation always shows in full; the two charts flex to fill the rest */
  .box { min-height: 0; overflow: hidden; }
  .box svg { width: 100%; height: 100%; display: block; }
  .explain { min-height: 0; overflow: hidden; font-size: 13.5px; line-height: 1.48; color: var(--ink); padding: 10px 13px; }
  @media (max-height: 640px) {
    .explain { font-size: 12px; line-height: 1.38; padding: 7px 10px; }
    .bar h1 { font-size: 18px; }
    .bar { padding: 2px 6px 3px; }
  }
  .explain .t { font-weight: 700; color: var(--term); display: block; margin-bottom: 4px; font-size: 14.5px; }
  .fadeable { opacity: 0; transition: opacity .5s ease; }
  .fadeable.on { opacity: 1; }
  :root.frozen, :root.frozen * { transition: none !important; animation: none !important; }
  .botbar { width: min(1320px, 98vw); margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 6px 6px 0; }
  .sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; }
  .lab { font-size: 12px; color: var(--muted); }
  #photonBtn { border-color: var(--photon); color: var(--photon); font-weight: 700; }
  .vbtn { min-width: 36px; font-size: 15px; }
</style>
</head>
<body>

<div class="bar">
  <h1>Single-photon avalanche diode (SPAD)</h1>
  <span class="spacer"></span>
  <button id="replay" type="button">Replay</button>
</div>
<div class="bar controls" role="group" aria-label="step controls">
  <button id="prev" type="button" aria-label="previous step">&#9664;</button>
  <button id="play" type="button" aria-label="pause or play">&#9654;</button>
  <button id="next" type="button" aria-label="next step">&#9654;&#9654;</button>
  <span id="chips" style="display:flex; gap:5px; flex-wrap:wrap;"></span>
</div>

<div class="main">
  <div class="left">
    <svg id="device" viewBox="72 78 432 362" preserveAspectRatio="xMidYMid meet" role="img" aria-label="pn junction device and circuit">
      <defs>
        <marker id="fa" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto">
          <polygon points="0,0 7,3.5 0,7" fill="var(--field)"/>
        </marker>
      </defs>

      <!-- external circuit (appears with reverse bias) -->
      <g id="circuitG" class="fadeable">
        <path id="wire" d="M124 236 V408 H436 V344 l8 -6 -16 -7 16 -7 -16 -7 8 -6 V236" fill="none" stroke="var(--edge)" stroke-width="4"/>
        <text x="454" y="322" font-size="11.5" fill="var(--muted)">resistor</text>
        <g id="wireDots"></g>
        <g id="blipDots"></g>
        <circle cx="196" cy="408" r="16" fill="var(--panel)" stroke="var(--muted)" stroke-width="2"/>
        <text x="196" y="413" font-size="14" text-anchor="middle" font-weight="700" fill="var(--muted)">A</text>
        <text id="ammReading" x="196" y="434" font-size="11" text-anchor="middle" fill="var(--muted)">current: none</text>
        <line x1="300" y1="392" x2="300" y2="424" stroke="var(--ink)" stroke-width="3.5"/>
        <line x1="316" y1="399" x2="316" y2="417" stroke="var(--ink)" stroke-width="2"/>
        <text x="345" y="404" font-size="11.5" fill="var(--muted)">reverse</text>
        <text x="345" y="418" font-size="11.5" fill="var(--muted)">voltage</text>
      </g>

      <!-- p side (slides in during the build) -->
      <g id="gP">
        <rect x="130" y="96" width="150" height="140" fill="var(--pface)"/>
        <rect x="116" y="96" width="14" height="140" rx="2" fill="var(--edge)"/>
        <text x="195" y="255" font-size="13" text-anchor="middle" fill="var(--hole)" font-weight="600">p region</text>
      </g>
      <!-- n side -->
      <g id="gN">
        <rect x="280" y="96" width="150" height="140" fill="var(--nface)"/>
        <rect x="430" y="96" width="14" height="140" rx="2" fill="var(--edge)"/>
        <text x="365" y="255" font-size="13" text-anchor="middle" fill="var(--elec)" font-weight="600">n region</text>
      </g>

      <!-- junction internals (appear once the junction has formed) -->
      <g id="junctionG" class="fadeable">
        <rect id="depl" x="255" y="96" width="50" height="140" fill="var(--deplface)" fill-opacity="0.85"/>
        <line x1="280" y1="96" x2="280" y2="236" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>
        <text x="280" y="86" font-size="9" text-anchor="middle" fill="var(--muted)" font-weight="600">depletion region</text>
      </g>

      <g id="arrows"></g>
      <g id="cores"><g id="coresP"></g><g id="coresN"></g></g>
      <g id="carriers"></g>
      <g id="movers"></g>
      <g id="parts"></g>
      <g id="flash"></g>

      <g id="photonG" opacity="0">
        <line x1="62" y1="-72" x2="12" y2="-14" stroke="var(--photon)" stroke-width="4.5" stroke-linecap="round"/>
        <polygon points="0,0 15.7,-7.6 5.1,-16.7" fill="var(--photon)"/>
        <text x="20" y="10" font-size="15" fill="var(--photon)" font-weight="700">photon</text>
      </g>
    </svg>
  </div>

  <div class="right">
    <div class="box rp fadeable" id="gaugeBox"><svg id="gauge" viewBox="0 0 320 46" role="img" aria-label="reverse voltage level">
      <text x="45" y="13" font-size="11" fill="var(--ink)">reverse voltage</text>
      <rect x="45" y="19" width="267" height="11" rx="3" fill="var(--bg)" stroke="var(--line)" stroke-width="1"/>
      <rect id="gfillGeiger" x="0" y="19" width="0" height="11" fill="var(--geizone)"/>
      <rect id="gfill" x="45" y="19" width="0" height="11" rx="3" fill="var(--photon)"/>
      <line id="gtick" y1="15" y2="34" stroke="var(--hot)" stroke-width="2"/>
      <text id="gtickLab" y="44" font-size="10.5" fill="var(--hot)" text-anchor="middle" font-weight="700">breakdown</text>
    </svg></div>

    <div class="box rp fadeable" id="ivBox"><svg id="iv" viewBox="0 0 320 196" role="img" aria-label="current versus reverse voltage">
      <rect id="regR" x="0" y="18" width="0" height="140" fill="var(--geizone)"/>
      <path id="curve" fill="none" stroke="var(--muted)" stroke-width="2.5"/>
      <line id="vbrLine" y1="18" y2="158" stroke="var(--hot)" stroke-width="2" stroke-dasharray="5 4"/>
      <line x1="45" y1="158" x2="312" y2="158" stroke="var(--ink)" stroke-width="1.6"/>
      <line x1="45" y1="158" x2="45" y2="18" stroke="var(--ink)" stroke-width="1.6"/>
      <text x="52" y="30" font-size="11" fill="var(--ink)">current</text>
      <text x="180" y="186" font-size="11" fill="var(--ink)" text-anchor="middle">reverse voltage &#8594;</text>
      <text id="vbrLabel" font-size="11" fill="var(--hot)" text-anchor="middle" font-weight="700" y="174">breakdown</text>
      <circle id="opdot" r="6" fill="var(--photon)" stroke="var(--edge)" stroke-width="1.4"/>
    </svg></div>

    <div class="box rp fadeable" id="outBox"><svg id="out" viewBox="0 0 320 150" preserveAspectRatio="xMidYMid meet" role="img" aria-label="output current over time">
      <line x1="45" y1="124" x2="312" y2="124" stroke="var(--ink)" stroke-width="1.4"/>
      <line x1="45" y1="124" x2="45" y2="20" stroke="var(--ink)" stroke-width="1.4"/>
      <text x="52" y="32" font-size="12" fill="var(--ink)">output current</text>
      <text x="180" y="144" font-size="11" fill="var(--ink)" text-anchor="middle">time &#8594;</text>
      <path id="scope" fill="none" stroke="var(--signal)" stroke-width="2.4" d=""/>
    </svg></div>

    <div class="explain rp" id="explain"></div>
  </div>
</div>

<div class="botbar">
  <span class="lab">reverse voltage</span>
  <button id="decBtn" class="vbtn" type="button">&minus;</button>
  <button id="incBtn" class="vbtn" type="button">+</button>
  <div class="sep"></div>
  <button id="geigerBtn" type="button">Enter Geiger mode</button>
  <button id="photonBtn" type="button" disabled>Send one photon</button>
</div>

<script>

  function curveI(v){ if(v<=VBR) return leak(v); return Math.min(1, leak(VBR)+(v-VBR)*0.5); }

  function mk(t,a){ var e=document.createElementNS(SVGNS,t); for(var k in a) e.setAttribute(k,a[k]); return e; }
  function clear(g){ while(g.firstChild) g.removeChild(g.firstChild); }
  function $(id){ return document.getElementById(id); }

  var depl=$('depl'), arrows=$('arrows'), carriers=$('carriers');
  var coresP=$('coresP'), coresN=$('coresN'), moversG=$('movers');
  var partsG=$('parts'), flashG=$('flash'), wireDots=$('wireDots'), blipDots=$('blipDots');
  var photonG=$('photonG'), amm=$('ammReading');
  var opdot=$('opdot'), scopeP=$('scope'), explain=$('explain');
  var photonBtn=$('photonBtn'), incBtn=$('incBtn'), decBtn=$('decBtn');
  var wire=$('wire'), wireLen=wire.getTotalLength();
  var gfill=$('gfill');
  var gP=$('gP'), gN=$('gN');

  (function(){
    var vbrX=px(VBR);
    var vl=$('vbrLine'); vl.setAttribute('x1',vbrX); vl.setAttribute('x2',vbrX);
    $('vbrLabel').setAttribute('x',vbrX);
    var rr=$('regR'); rr.setAttribute('x',vbrX); rr.setAttribute('width', R-vbrX);
    var d='',f=true;
    for(var v=0;v<=VMAX;v+=1.5){ d+=(f?'M':'L')+px(v).toFixed(1)+' '+py(curveI(v)).toFixed(1)+' '; f=false; }
    $('curve').setAttribute('d',d);
    $('gtick').setAttribute('x1',vbrX); $('gtick').setAttribute('x2',vbrX);
    $('gtickLab').setAttribute('x',vbrX);
    var gg=$('gfillGeiger'); gg.setAttribute('x',vbrX); gg.setAttribute('width',R-vbrX);
  })();

  // background carrier population; each carrier belongs to one side and
  // follows that side's build offset while the device is being assembled
  var CARR_ROWS=[118,146,174,202,224];
  var INNER_H=256, INNER_E=304;   // innermost carrier columns, consumed by recombination
  var bulk=[];
  (function(){
    var holeXs=[146,168,190,212,234,INNER_H], elecXs=[INNER_E,326,348,370,392,414];
    function add(x,y,type){
      var g=mk('g',{});
      g.appendChild(mk('circle',{cx:0,cy:0,r:7,fill:type==='h'?'var(--hole)':'var(--elec)'}));
      var t=mk('text',{x:0,y:3.5,'font-size':10,'text-anchor':'middle',fill:'#fff','font-weight':700});
      t.textContent=type==='h'?'+':'−'; g.appendChild(t);
      carriers.appendChild(g);
      bulk.push({el:g,bx:x,by:y,x:x,type:type,gone:false,ph:rnd()*6.28});
    }
    for(var r=0;r<CARR_ROWS.length;r++){
      for(var i=0;i<holeXs.length;i++) add(holeXs[i],CARR_ROWS[r],'h');
      for(var j=0;j<elecXs.length;j++) add(elecXs[j],CARR_ROWS[r],'e');
    }
  })();

  // fixed dopant ions: acceptor ions (−) in the p region, donor ions (+) in the
  // n region; interleaved with the mobile carriers, they never move
  (function(){
    var pIonXs=[157,179,201,223,245,267], nIonXs=[293,315,337,359,381,403], ionYs=[132,160,188,216];
    function ion(parent,x,y,sign,color){
      var g=mk('g',{opacity:0.8});
      g.appendChild(mk('circle',{cx:x,cy:y,r:5.5,fill:'none',stroke:color,'stroke-width':1.6}));
      var t=mk('text',{x:x,y:y+3,'font-size':9,'text-anchor':'middle',fill:color,'font-weight':700});
      t.textContent=sign; g.appendChild(t);
      parent.appendChild(g);
    }
    for(var r=0;r<ionYs.length;r++){
      for(var i=0;i<pIonXs.length;i++) ion(coresP,pIonXs[i],ionYs[r],'−','var(--hole)');
      for(var j=0;j<nIonXs.length;j++) ion(coresN,nIonXs[j],ionYs[r],'+','var(--elec)');
    }
  })();

  var wdots=[];
  (function(){ for(var i=0;i<12;i++){ var c=mk('circle',{r:4,fill:'var(--photon)',opacity:0}); wireDots.appendChild(c); wdots.push(c); } })();

  // ---------- live physics ----------
  var parts=[], flashes=[], blips=[];
  var NSCOPE=200, scope=[]; for(var s0=0;s0<NSCOPE;s0++) scope.push(0);
  var bump=0, fc=0, wirePhase=0, thermalClock=0;

  var BH={seeds:false, mult:'none', thermalEvery:999999};
  var SV={v:0};
  var OFF={p:0, n:0};          // build offsets of the two halves
  var buildStage=5;             // 1 p only, 2 both apart, 3 joined, 4 depletion formed, 5 circuit on
  var assembled=true;           // depletion region formed?
  var dispW=Whalf(0), lastStaticW=-99;

  function multOf(v){ return v>=VBR? 'div' : (v>=45? 'finite' : 'none'); }

  function spawnPair(x,y,gen){
    parts.push({x:x,y:y,type:'e',vx:0.3,vy:(rnd()-0.5)*0.5,gen:gen,en:0,ionized:false});
    parts.push({x:x,y:y,type:'h',vx:-0.3,vy:(rnd()-0.5)*0.5,gen:gen,en:0,ionized:false});
  }
  function thermalPair(){
    var W=dispW;
    var x=JX+(rnd()*2-1)*(W*0.7), y=DEV_T+8+rnd()*(DEV_B-DEV_T-16);
    spawnPair(x,y,0);
    flashes.push({x:x,y:y,age:0,kind:'th'});
  }

  // recombination movers (junction-formation step): one hole and one electron
  // walk to the junction, meet, and both vanish in a ring flash
  var movers=[], moverPid=0;
  function startRecombRow(y){
    for(var i=0;i<bulk.length;i++){
      var b=bulk[i];
      if(b.by===y && (b.bx===INNER_H || b.bx===INNER_E)) b.gone=true;
    }
    var pid=++moverPid;
    movers.push({x:INNER_H,y:y,type:'h',pid:pid});
    movers.push({x:INNER_E,y:y,type:'e',pid:pid});
  }
  function spawnDeepPair(){
    var y=CARR_ROWS[Math.floor(rnd()*CARR_ROWS.length)];
    for(var i=0;i<movers.length;i++) if(movers[i].y===y) return;
    var pid=++moverPid;
    movers.push({x:JX-42,y:y,type:'h',pid:pid});
    movers.push({x:JX+42,y:y,type:'e',pid:pid});
  }

  function physics(){
    if(!assembled){ scope.push(0); scope.shift(); return 0; }
    var v=SV.v, f=v/VMAX, W=dispW;
    var mult=BH.mult==='auto'? multOf(v) : BH.mult;

    if(BH.seeds){ thermalClock--; if(thermalClock<=0){ thermalPair(); thermalClock=BH.thermalEvery*(0.6+rnd()*0.8); } }

    var active = parts.length>=6 && mult==='div';
    if(active && parts.length<16) spawnPair(JX+(rnd()*2-1)*W*0.5, DEV_T+8+rnd()*(DEV_B-DEV_T-16), 2);

    var next=[];
    for(var i=0;i<parts.length;i++){
      var p=parts[i];
      var dir = p.type==='e'? 1:-1;
      var inD = Math.abs(p.x-JX)<W;
      var acc = inD? (0.028+0.16*f) : 0.05;
      p.vx += dir*acc;
      var cap = 1.0+3.4*f;
      if(p.vx>cap)p.vx=cap; if(p.vx<-cap)p.vx=-cap;
      p.x+=p.vx; p.y+=p.vy;
      if(p.y<DEV_T+4){p.y=DEV_T+4;p.vy=Math.abs(p.vy);} if(p.y>DEV_B-4){p.y=DEV_B-4;p.vy=-Math.abs(p.vy);}
      if(inD) p.en += Math.abs(p.vx);

      if(inD && p.en>46){
        if(mult==='div' && parts.length+next.length<40){
          p.en=0; spawnPair(p.x,p.y,p.gen+1);
          flashes.push({x:p.x,y:p.y,age:0,kind:'ion'});
        } else if(mult==='finite' && !p.ionized && p.gen===0){
          p.ionized=true; p.en=0; spawnPair(p.x,p.y,1);
          flashes.push({x:p.x,y:p.y,age:0,kind:'ion'});
        } else p.en=0;
      }

      if(p.type==='h' && p.x<P_EDGE+4){ onExit(active); continue; }
      if(p.type==='e' && p.x>N_EDGE-4){ onExit(active); continue; }
      next.push(p);
    }
    parts=next;

    function onExit(act){ if(!act){ if(blips.length<4) blips.push({t:0.02}); bump=Math.min(0.14,bump+0.05); } }

    bump*=0.94;
    var level;
    if(mult==='div') level = Math.min(1, parts.length/13);
    else level = Math.min(0.16, parts.length*0.012 + bump);
    scope.push(level); scope.shift();
    return level;
  }

  // ---------- rendering ----------
  function drawStatics(W){
    clear(arrows);
    if(!assembled) return;
    var v=SV.v;
    if(v>2){
      var aYs=[128,167,206];
      var op=(0.18+0.72*(v/VMAX));
      for(var a=0;a<aYs.length;a++)
        arrows.appendChild(mk('line',{x1:JX+W-6,y1:aYs[a],x2:JX-W+6,y2:aYs[a],stroke:'var(--field)','stroke-width':(1.4+1.6*v/VMAX).toFixed(1),'marker-end':'url(#fa)',opacity:op.toFixed(2)}));
    }
  }

  function draw(){
    fc++;
    var v=SV.v;
    var target=assembled? Whalf(v) : 0;
    dispW += (target-dispW)*0.16;
    depl.setAttribute('x', JX-dispW); depl.setAttribute('width', Math.max(0,2*dispW));
    if(Math.abs(dispW-lastStaticW)>0.5){ drawStatics(dispW); lastStaticW=dispW; }

    gP.setAttribute('transform','translate('+(-OFF.p)+',0)');
    gN.setAttribute('transform','translate('+OFF.n+',0)');
    coresP.setAttribute('transform','translate('+(-OFF.p)+',0)');
    coresN.setAttribute('transform','translate('+OFF.n+',0)');

    var level=physics();
    var big = level>0.45;

    for(var i=0;i<bulk.length;i++){
      var b=bulk[i];
      var off = b.type==='h'? -OFF.p : OFF.n;
      if(big){
        b.x += (b.type==='h'? -2.4 : 2.4);
        if(b.type==='h' && b.x < P_EDGE) b.x = JX - 8 - rnd()*12;
        if(b.type==='e' && b.x > N_EDGE) b.x = JX + 8 + rnd()*12;
        b.el.style.display='';
        b.el.setAttribute('transform','translate('+(b.x+off).toFixed(1)+','+(b.by+1.6*Math.cos(fc*0.05+b.ph*1.3)).toFixed(1)+')');
      } else {
        b.x += (b.bx-b.x)*0.2;
        var vis = !assembled || (b.type==='h' ? (b.bx < JX-dispW-8) : (b.bx > JX+dispW+8));
        if(b.type==='e' && buildStage<2) vis=false;
        if(b.gone) vis=false;
        if(!vis){ b.el.style.display='none'; continue; }
        b.el.style.display='';
        b.el.setAttribute('transform','translate('+(b.x+off+1.7*Math.sin(fc*0.06+b.ph)).toFixed(1)+','+(b.by+1.5*Math.cos(fc*0.05+b.ph*1.3)).toFixed(1)+')');
      }
    }

    clear(moversG);
    if(movers.length){
      var metP={}, keepM=[];
      for(var mi=0;mi<movers.length;mi++){
        var m=movers[mi];
        if(m.type==='h'){ if(m.x<JX-3.5) m.x+=0.62; }
        else            { if(m.x>JX+3.5) m.x-=0.62; }
        var arrived = m.type==='h'? (m.x>=JX-3.5) : (m.x<=JX+3.5);
        if(arrived) metP[m.pid]=(metP[m.pid]||0)+1;
      }
      for(var mj=0;mj<movers.length;mj++){
        var m2=movers[mj];
        if(metP[m2.pid]===2){
          if(m2.type==='h') flashes.push({x:JX,y:m2.y,age:0,kind:'rec'});
          continue;
        }
        keepM.push(m2);
        var gm=mk('g',{transform:'translate('+m2.x.toFixed(1)+','+m2.y+')'});
        gm.appendChild(mk('circle',{cx:0,cy:0,r:7,fill:m2.type==='h'?'var(--hole)':'var(--elec)'}));
        var tm=mk('text',{x:0,y:3.5,'font-size':10,'text-anchor':'middle',fill:'#fff','font-weight':700});
        tm.textContent=m2.type==='h'?'+':'−'; gm.appendChild(tm);
        moversG.appendChild(gm);
      }
      movers=keepM;
    }

    clear(partsG);
    for(var c=0;c<parts.length;c++){
      var p=parts[c];
      partsG.appendChild(mk('circle',{cx:p.x.toFixed(1),cy:p.y.toFixed(1),r:5,fill:p.type==='e'?'var(--elec)':'var(--hole)',stroke:'var(--panel)','stroke-width':1}));
    }

    clear(flashG); var nf=[];
    for(var f2=0;f2<flashes.length;f2++){
      var fl=flashes[f2]; fl.age++;
      var life = fl.kind==='rec'? 36 : (fl.kind==='burst'? 30 : 16);
      if(fl.age>=life) continue;
      nf.push(fl);
      var fade=(1-fl.age/life);
      if(fl.kind==='burst'){
        flashG.appendChild(mk('circle',{cx:fl.x,cy:fl.y,r:(5+fl.age*0.35).toFixed(1),
          fill:'var(--photon)',opacity:(0.85*fade).toFixed(2)}));
        flashG.appendChild(mk('circle',{cx:fl.x,cy:fl.y,r:(3+fl.age*0.95).toFixed(1),
          fill:'none',stroke:'var(--photon)','stroke-width':3,opacity:fade.toFixed(2)}));
        var r1=7+fl.age*0.9, r2=r1+8;
        for(var sp=0;sp<8;sp++){
          var an=sp*Math.PI/4+0.39, ca=Math.cos(an), sa=Math.sin(an);
          flashG.appendChild(mk('line',{x1:(fl.x+ca*r1).toFixed(1),y1:(fl.y+sa*r1).toFixed(1),
            x2:(fl.x+ca*r2).toFixed(1),y2:(fl.y+sa*r2).toFixed(1),
            stroke:'var(--photon)','stroke-width':2.2,'stroke-linecap':'round',opacity:fade.toFixed(2)}));
        }
      } else {
        flashG.appendChild(mk('circle',{cx:fl.x.toFixed(1),cy:fl.y.toFixed(1),
          r:(3+fl.age*(fl.kind==='ion'?0.9:(fl.kind==='rec'?0.42:0.6))).toFixed(1),fill:'none',
          stroke: fl.kind==='ion'?'var(--photon)':(fl.kind==='rec'?'var(--term)':'var(--muted)'),'stroke-width':2.2,
          opacity:fade.toFixed(2)}));
      }
    }
    flashes=nf;

    if(big) wirePhase+=0.013;
    for(var w=0;w<wdots.length;w++){
      if(!big){ wdots[w].setAttribute('opacity',0); continue; }
      var pt=wire.getPointAtLength(((w/wdots.length)+wirePhase)%1*wireLen);
      wdots[w].setAttribute('cx',pt.x); wdots[w].setAttribute('cy',pt.y); wdots[w].setAttribute('opacity',0.95);
    }
    clear(blipDots); var nb=[];
    for(var bl=0;bl<blips.length;bl++){
      var q=blips[bl]; q.t+=0.006;
      if(q.t<1){ nb.push(q);
        var bp=wire.getPointAtLength(q.t*wireLen);
        blipDots.appendChild(mk('circle',{cx:bp.x,cy:bp.y,r:4,fill:'var(--photon)',opacity:0.7}));
      }
    }
    blips=nb;

    amm.textContent = big? 'current: large' : (level>0.02? 'current: tiny leakage' : 'current: none');
    gfill.setAttribute('width', Math.max(0,(px(v)-L)));
    opdot.setAttribute('cx',px(v));
    opdot.setAttribute('cy',py(Math.min(1,Math.max(level, leak(v)*0.4))));

    var d='',first=true, step=(R-L)/NSCOPE;
    for(var sx=0;sx<NSCOPE;sx++){
      d+=(first?'M':'L')+(L+sx*step).toFixed(1)+' '+(124-scope[sx]*96).toFixed(1)+' ';
      first=false;
    }
    scopeP.setAttribute('d',d);
  }

  // ---------- steps ----------
  var STEPS=[
    {id:'ptype', v:0, seeds:false, mult:'none', build:1,
     text:'<span class="t">1. Start with a p-type semiconductor region</span>The p region is doped with acceptor atoms: each acceptor is a fixed negative ion that releases one mobile hole. The filled circles are the mobile holes; the small rings are the fixed acceptor ions. Holes are the majority carriers of the p region.'},
    {id:'ntype', v:0, seeds:false, mult:'none', build:2,
     text:'<span class="t">2. Add an n-type semiconductor region</span>The n region is doped with donor atoms: each donor is a fixed positive ion that releases one mobile electron. The filled circles are the mobile electrons; the small rings are the fixed donor ions. Electrons are the majority carriers of the n region.'},
    {id:'junction', v:0, seeds:false, mult:'none', build:3,
     text:'<span class="t">3. Bring them into contact: the pn junction</span>The two regions join into one bar. Mobile electrons and mobile holes diffuse to the boundary and recombine: the pair disappears, and each teal ring marks one recombination event.'},
    {id:'depletion', v:0, seeds:false, mult:'none', build:4,
     text:'<span class="t">4. A depletion region forms at the junction</span>The recombination has emptied the boundary layer of mobile carriers: this layer is the depletion region. Only the fixed ions remain in it, negative acceptor ions on the p side and positive donor ions on the n side.'},
    {id:'seeds', v:16, seeds:true, mult:'none',
     text:'<span class="t">5. Reverse bias, and heat creates seed carriers</span>A voltage source connects through a series resistor, plus to the n side and minus to the p side: reverse bias. Heat continuously creates electron-hole pairs in the depletion region, and these seed carriers form the tiny leakage current.'},
    {id:'widen', v:36, seeds:true, mult:'none',
     text:'<span class="t">6. More reverse bias widens the depletion region</span>A larger reverse voltage widens the depletion region and strengthens the electric field, shown by the arrows. The leakage current stays tiny, because heat sets the number of seed carriers, not the voltage.'},
    {id:'finite', v:52, seeds:true, mult:'finite', thermalEvery:90,
     text:'<span class="t">7. Below breakdown: every avalanche dies out</span>The field is now strong enough for impact ionization: a fast carrier knocks a bound electron free and creates one new electron-hole pair. Below the breakdown voltage each carrier creates on average less than one new carrier, so every avalanche dies out by itself. The current stays small.'},
    {id:'breakdown', v:VBR, seeds:true, mult:'div',
     text:'<span class="t">8. At breakdown: the avalanche sustains itself</span>At the breakdown voltage each carrier creates on average at least one new carrier, so the avalanche no longer dies out. The carriers multiply again and again, and the tiny leakage current grows into a large current, limited only by the external circuit.'},
    {id:'geiger', v:GEIGERV, seeds:false, mult:'div',
     text:'<span class="t">9. Geiger mode: above breakdown, no current</span>Geiger mode holds the reverse voltage above the breakdown voltage while the depletion region holds no free carrier, so no current flows. One single free carrier will now start a self-sustaining avalanche.'},
    {id:'photon', v:GEIGERV, seeds:false, mult:'div', photon:true,
     text:'<span class="t">10. One photon triggers the avalanche</span>One photon creates one electron-hole pair, and impact ionization multiplies it into a self-sustaining avalanche. A large current flows and the output shows one pulse, the same size for every photon.'},
    {id:'quench', v:QUENCHV, seeds:false, mult:'auto',
     text:'<span class="t">11. Quench: the series resistor stops the avalanche</span>The large avalanche current produces a large voltage drop across the series resistor. The diode voltage equals the supply voltage minus this drop, so it falls below the breakdown voltage. Below breakdown impact ionization no longer sustains the avalanche, and the current stops. This is quenching.'}
  ];
  var idx=0, timers=[], frozen=false;

  // announce the current 1-based step to the parent deck (single central place:
  // called at the end of setStep and sweepTo, which is where the chips toggle active)
  function announce(){ try { parent.postMessage({ animState: { step: idx+1, total: STEPS.length } }, '*'); } catch(e){} }

  function later(fn,ms){ if(frozen){ return; } timers.push(setTimeout(fn,ms)); }
  function cancelTimers(){ timers.forEach(clearTimeout); timers=[]; if(window.anime){ anime.remove(SV); anime.remove(OFF); } }

  function tweenV(target,dur){
    if(frozen){ SV.v=target; return; }
    anime({targets:SV, v:target, duration:dur||700, easing:'easeInOutQuad'});
  }

  function firePhoton(){
    var W=Whalf(GEIGERV);
    var tx=JX+(rnd()*2-1)*W*0.4, ty=DEV_T+40+rnd()*(DEV_B-DEV_T-70);
    if(frozen){
      photonG.setAttribute('opacity','1');
      photonG.setAttribute('transform','translate('+tx+','+ty+')');
      spawnPair(tx,ty,0); flashes.push({x:tx,y:ty,age:0,kind:'burst'});
      return;
    }
    var pos={x:tx+120, y:ty-140}, stepAt=idx;
    photonG.setAttribute('transform','translate('+pos.x+','+pos.y+')');
    photonG.setAttribute('opacity','1');
    anime({targets:pos, x:tx, y:ty, duration:950, easing:'linear',
      update:function(){ photonG.setAttribute('transform','translate('+pos.x.toFixed(1)+','+pos.y.toFixed(1)+')'); },
      complete:function(){
        photonG.setAttribute('opacity','0');
        if(idx!==stepAt) return;
        spawnPair(tx,ty,0);
        flashes.push({x:tx,y:ty,age:0,kind:'burst'});
      }});
  }

  function setBuild(stage, instant){
    // stage 1: p alone; 2: n arrives, gap open; 3: halves join; 4: depletion; 5: circuit
    buildStage=stage;
    assembled = (stage>=4);
    var gapP = (stage<3)? 40 : 0, gapN = (stage<3)? 40 : 0;
    gN.style.display = (stage>=2)? '' : 'none';
    coresN.style.display = (stage>=2)? '' : 'none';
    var circuitOn = (stage>=5);
    $('circuitG').classList.toggle('on', circuitOn);
    $('junctionG').classList.toggle('on', stage>=4);
    $('gaugeBox').classList.toggle('on', circuitOn);
    $('ivBox').classList.toggle('on', circuitOn);
    $('outBox').classList.toggle('on', circuitOn);
    if(instant){ OFF.p=gapP; OFF.n=gapN; }
    else anime({targets:OFF, p:gapP, n:gapN, duration:800, easing:'easeInOutQuad'});
  }

  function setStep(i, instant){
    cancelTimers();
    idx=i; var st=STEPS[i];
    var stage = st.build || 5;
    BH={seeds:!!st.seeds, mult:st.mult, thermalEvery: st.thermalEvery||150};
    if(st.id!=='quench') parts=[];
    flashes=[]; blips=[]; movers=[]; bump=0; thermalClock=30;
    // innermost carrier columns recombined during junction formation, so from
    // the depletion step onward they stay absent
    for(var bi=0;bi<bulk.length;bi++) bulk[bi].gone = (stage>=4) && Math.abs(bulk[bi].bx-JX)<26;
    photonG.setAttribute('opacity','0');
    explain.innerHTML=st.text;
    setBuild(stage, instant);
    photonBtn.disabled = !(st.id==='geiger');
    incBtn.disabled = decBtn.disabled = !(i>=4 && i<=7);
    if(instant){ SV.v=st.v; } else { tweenV(st.v, 800); }
    if(st.id==='junction'){
      if(frozen){
        [CARR_ROWS[1],CARR_ROWS[2]].forEach(function(y){
          for(var fi=0;fi<bulk.length;fi++){ var fb=bulk[fi];
            if(fb.by===y && (fb.bx===INNER_H||fb.bx===INNER_E)) fb.gone=true; }
        });
        flashes.push({x:JX,y:CARR_ROWS[1],age:4,kind:'rec'});
        var fpid=++moverPid;
        movers.push({x:JX-9,y:CARR_ROWS[2],type:'h',pid:fpid});
        movers.push({x:JX+9,y:CARR_ROWS[2],type:'e',pid:fpid});
      } else {
        CARR_ROWS.forEach(function(y,k){ later(function(){ startRecombRow(y); }, 950+k*600); });
        later(function loopDeep(){
          if(STEPS[idx].id!=='junction') return;
          spawnDeepPair();
          later(loopDeep, 1150);
        }, 950+CARR_ROWS.length*600+600);
      }
    }
    if(st.photon){ if(frozen){ firePhoton(); } else { later(firePhoton, 900); } }
    chips.forEach(function(c,k){ c.classList.toggle('active', k===i); });
    announce();
  }

  function sweepTo(v){
    cancelTimers();
    var j = v<8? 3 : v<30? 4 : v<45? 5 : v<VBR? 6 : 7;
    idx=j; var st=STEPS[j];
    BH={seeds: v>=8, mult: multOf(v), thermalEvery:150};
    explain.innerHTML=st.text;
    setBuild(5, false);
    photonBtn.disabled=true; incBtn.disabled=decBtn.disabled=false;
    tweenV(v, 500);
    chips.forEach(function(c,k){ c.classList.toggle('active', k===j); });
    announce();
  }

  // ---------- step player (deck-consistent controls) ----------
  var playing=false, autoTimer=null;
  var DUR=[6000,6000,7000,8000,11000,9000,10000,10000,9000,11000,11000,9000,12000];
  function stopAuto(){ if(autoTimer){ clearTimeout(autoTimer); autoTimer=null; } }
  function stopPlay(){ playing=false; $('play').innerHTML='&#9654;'; stopAuto(); }
  function schedule(){
    stopAuto();
    autoTimer=setTimeout(function(){
      if(!playing) return;
      if(idx<STEPS.length-1){ setStep(idx+1); schedule(); } else stopPlay();
    }, DUR[idx]);
  }
  function startPlay(){ playing=true; $('play').innerHTML='&#10074;&#10074;'; if(idx>=STEPS.length-1) setStep(0); schedule(); }

  var chipsBox=$('chips');
  STEPS.forEach(function(_,k){
    var b=document.createElement('button');
    b.className='chip'; b.type='button'; b.textContent=k+1;
    b.addEventListener('click', function(){ stopPlay(); setStep(k); });
    chipsBox.appendChild(b);
  });
  var chips=Array.prototype.slice.call(chipsBox.children);

  $('next').addEventListener('click', function(){ stopPlay(); if(idx<STEPS.length-1) setStep(idx+1); });
  $('prev').addEventListener('click', function(){ stopPlay(); if(idx>0) setStep(idx-1); });
  $('play').addEventListener('click', function(){ playing? stopPlay() : startPlay(); });
  $('replay').addEventListener('click', function(){ stopPlay(); setStep(0); startPlay(); });
  document.addEventListener('keydown', function(e){
    if(e.key==='ArrowRight'){ stopPlay(); if(idx<STEPS.length-1) setStep(idx+1); }
    if(e.key==='ArrowLeft'){ stopPlay(); if(idx>0) setStep(idx-1); }
  });

  incBtn.onclick=function(){ stopPlay(); sweepTo(Math.min(VBR+4, SV.v+6)); };
  decBtn.onclick=function(){ stopPlay(); sweepTo(Math.max(0, SV.v-6)); };
  $('geigerBtn').onclick=function(){ stopPlay(); setStep(8); };
  photonBtn.onclick=function(){
    if(photonBtn.disabled) return;
    stopPlay();
    setStep(9);
    later(function(){ setStep(10); }, 2600);
  };

  // ---------- deck-driven step control (postMessage from the parent deck) ----------
  // next/prev behave exactly like the on-screen buttons; goto parks instantly.
  addEventListener('message', function(e){
    var d = e && e.data;
    if(!d || !d.anim) return;
    if(d.anim==='next'){ stopPlay(); if(idx<STEPS.length-1) setStep(idx+1); }
    else if(d.anim==='prev'){ stopPlay(); if(idx>0) setStep(idx-1); }
    else if(d.anim==='goto'){ stopPlay(); var k=(d.step|0); if(k>=1 && k<=STEPS.length) setStep(k-1, true); }
  });

  // ---------- lock body height to the real iframe height (vh/% are unreliable in an iframe) ----------
  function fit(){ document.body.style.height = window.innerHeight + 'px'; }
  window.addEventListener('resize', fit); fit();

  // ---------- boot ----------
  function frame(){ draw(); if(!frozen) requestAnimationFrame(frame); }

  var q=location.search.match(/shot=([a-z\-]+)/);
  if(q){
    frozen=true;
    document.documentElement.classList.add('frozen');
    var found=-1;
    for(var i=0;i<STEPS.length;i++){ if(STEPS[i].id===q[1]){ found=i; break; } }
    if(found<0) found=0;
    reseed();
    setStep(found, true);
    dispW=assembled? Whalf(SV.v):0; lastStaticW=-99;
    var st=STEPS[found];
    if(st.id==='breakdown'){ spawnPair(JX,166,0); }
    var steps = (st.mult==='div' && (st.photon||st.id==='breakdown'))? 130
              : (st.id==='junction'? 8 : 60);
    for(var k=0;k<steps;k++) draw();
  } else {
    var hs=(location.hash||'').match(/s(\d+)/);
    var start = hs? Math.max(0, Math.min(STEPS.length-1, parseInt(hs[1],10)-1)) : 0;
    setStep(start, true);
    requestAnimationFrame(frame);
  }
})();
</script>
<script>
(function () {
  var d = document.documentElement;
  function apply(t) { d.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light'); }
  var m = (location.search.match(/[?&]theme=(dark|light)/) || [])[1];
  apply(m || 'light');
  addEventListener('message', function (e) {
    if (e && e.data && (e.data.theme === 'dark' || e.data.theme === 'light')) apply(e.data.theme);
  });
})();
</script>
