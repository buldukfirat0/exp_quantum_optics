<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From reverse bias to Geiger mode</title>
<style>
  :root{
    --beige:#efe7d8; --card:#faf6ee; --ink:#2b2b2b; --muted:#6b6256;
    --navy:#1f3a5f; --line:#d8cdb8;
    --hole:#d1552f; --elec:#2f6fb0; --current:#e6b800; --orange:#d98a3d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--beige); color:var(--ink);
    font-family:"Segoe UI",Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:8px;
  }
  .card{
    background:var(--card); width:100%; max-width:1240px; max-height:100vh;
    border:1px solid var(--line); border-radius:12px; overflow:hidden;
    display:flex; flex-direction:column;
  }
  header{background:var(--navy); color:#f4efe4; padding:9px 18px; display:flex; align-items:baseline; gap:14px}
  header h1{margin:0; font-size:17px; font-weight:600}
  header .stage{font-size:13px; opacity:.92; font-weight:600}
  .body{display:flex; flex:1; min-height:0}
  .left{flex:1.8; padding:6px 4px 4px 10px; display:flex; align-items:center; justify-content:center}
  .left svg{width:100%; height:auto; max-height:76vh}
  .right{flex:1; padding:10px 16px; border-left:1px solid var(--line);
         display:flex; flex-direction:column; gap:8px; overflow:auto; min-width:310px}
  .right svg{width:100%; height:auto; flex-shrink:0}
  .explain{font-size:13.5px; line-height:1.52}
  .explain .t{font-weight:700; color:var(--navy); display:block; margin-bottom:3px; font-size:14px}
  footer{border-top:1px solid var(--line); padding:9px 16px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:#f3ecdd}
  .grp{display:flex; gap:6px; align-items:center}
  .sep{width:1px; height:26px; background:var(--line); margin:0 4px}
  .lab{font-size:12px; color:var(--muted); margin-right:2px}
  button{
    font:inherit; font-size:13px; font-weight:600; cursor:pointer;
    border:1px solid var(--line); border-radius:8px; padding:7px 11px; color:var(--ink); background:#f1ead9;
  }
  button:hover{filter:brightness(.97)} button:active{transform:translateY(1px)}
  button:disabled{opacity:.4; cursor:not-allowed}
  #nextBtn{background:var(--navy); color:#f4efe4; border-color:var(--navy)}
  #photonBtn{background:var(--orange); color:#2b2b2b; border-color:#c37b2f}
  .vbtn{font-size:16px; min-width:38px}
</style>
</head>
<body>
<div class="card">
  <header>
    <h1>From reverse bias to Geiger mode</h1>
    <span class="stage" id="stageTitle"></span>
  </header>

  <div class="body">
    <div class="left">
      <svg id="device" viewBox="0 0 560 470" role="img" aria-label="pn junction device and circuit">
        <defs>
          <linearGradient id="pGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f8e6da"/><stop offset="1" stop-color="#efceba"/>
          </linearGradient>
          <linearGradient id="nGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#e8f0f8"/><stop offset="1" stop-color="#cfe0ef"/>
          </linearGradient>
          <linearGradient id="deplGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#c9c3b4"/><stop offset="0.5" stop-color="#d9d3c4"/><stop offset="1" stop-color="#c9c3b4"/>
          </linearGradient>
          <marker id="fa" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto">
            <polygon points="0,0 7,3.5 0,7" fill="#6f4aa6"/>
          </marker>
        </defs>

        <!-- external circuit: leads down to the bottom rail; series resistor on the right leg -->
        <path id="wire" d="M124 236 V408 H436 V344 l8 -6 -16 -7 16 -7 -16 -7 8 -6 V236" fill="none" stroke="#8b8578" stroke-width="4"/>
        <text x="454" y="322" font-size="11.5" fill="#6b6256">resistor</text>
        <g id="wireDots"></g>
        <g id="blipDots"></g>

        <!-- ammeter -->
        <circle cx="196" cy="408" r="16" fill="#faf6ee" stroke="#5c6470" stroke-width="2"/>
        <text x="196" y="413" font-size="14" text-anchor="middle" font-weight="700" fill="#5c6470">A</text>
        <text id="ammReading" x="196" y="440" font-size="12" text-anchor="middle" fill="#6b6256">current: none</text>

        <!-- voltage source at the bottom -->
        <line x1="300" y1="392" x2="300" y2="424" stroke="#2b2b2b" stroke-width="3.5"/>
        <line x1="316" y1="399" x2="316" y2="417" stroke="#2b2b2b" stroke-width="2"/>
        <text x="345" y="404" font-size="11.5" fill="#6b6256">reverse</text>
        <text x="345" y="418" font-size="11.5" fill="#6b6256">voltage</text>

        <!-- device body -->
        <rect x="130" y="96" width="150" height="140" fill="url(#pGrad)"/>
        <rect x="280" y="96" width="150" height="140" fill="url(#nGrad)"/>
        <rect id="depl" x="255" y="96" width="50" height="140" fill="url(#deplGrad)" fill-opacity="0.8"/>
        <rect x="116" y="96" width="14" height="140" rx="2" fill="#4a4a4a"/>
        <rect x="430" y="96" width="14" height="140" rx="2" fill="#4a4a4a"/>
        <rect x="116" y="96" width="328" height="140" rx="4" fill="none" stroke="#b7ae9a" stroke-width="1.5"/>
        <line x1="280" y1="96" x2="280" y2="236" stroke="#b7ae9a" stroke-width="1" stroke-dasharray="3 3"/>

        <g id="arrows"></g>
        <g id="cores"></g>
        <g id="carriers"></g>
        <g id="parts"></g>
        <g id="flash"></g>

        <text x="195" y="255" font-size="13" text-anchor="middle" fill="#a5502a" font-weight="600">p region</text>
        <text x="365" y="255" font-size="13" text-anchor="middle" fill="#22527d" font-weight="600">n region</text>
        <text x="280" y="86" font-size="12" text-anchor="middle" fill="#5c5c5c" font-weight="600">depletion region</text>

        <g id="photonG" opacity="0">
          <line x1="-57" y1="-53" x2="0" y2="0" stroke="#b58a00" stroke-width="3"/>
          <polygon points="0,0 -8,-11 -13,-3" fill="#b58a00"/>
          <text x="-64" y="-58" font-size="12" fill="#b58a00" font-weight="700">photon</text>
        </g>
      </svg>
    </div>

    <div class="right">
      <!-- voltage gauge -->
      <svg id="gauge" viewBox="0 0 320 46" role="img" aria-label="reverse voltage level">
        <text x="45" y="11" font-size="11" fill="#2b2b2b">reverse voltage</text>
        <rect x="45" y="17" width="267" height="11" rx="3" fill="#e7dfcc" stroke="#cfc6ae" stroke-width="1"/>
        <rect id="gfillGeiger" x="0" y="17" width="0" height="11" fill="#dcead e"/>
        <rect id="gfill" x="45" y="17" width="0" height="11" rx="3" fill="#d98a3d"/>
        <line id="gtick" y1="13" y2="32" stroke="#c0392b" stroke-width="2"/>
        <text id="gtickLab" y="42" font-size="10.5" fill="#c0392b" text-anchor="middle" font-weight="700">breakdown</text>
      </svg>

      <svg id="iv" viewBox="0 0 320 196" role="img" aria-label="current versus reverse voltage">
        <rect id="regR" x="0" y="18" width="0" height="140" fill="#eef4ee"/>
        <path id="curve" fill="none" stroke="#5c6470" stroke-width="2.5"/>
        <line id="vbrLine" y1="18" y2="158" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4"/>
        <line x1="45" y1="158" x2="312" y2="158" stroke="#2b2b2b" stroke-width="1.6"/>
        <line x1="45" y1="158" x2="45" y2="18" stroke="#2b2b2b" stroke-width="1.6"/>
        <text x="52" y="30" font-size="11" fill="#2b2b2b">current</text>
        <text x="180" y="186" font-size="11" fill="#2b2b2b" text-anchor="middle">reverse voltage &#8594;</text>
        <text id="vbrLabel" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700" y="174">breakdown</text>
        <circle id="opdot" r="6" fill="#d98a3d" stroke="#8a531b" stroke-width="1.4"/>
      </svg>

      <svg id="out" viewBox="0 0 320 88" role="img" aria-label="output current over time">
        <line x1="45" y1="70" x2="312" y2="70" stroke="#2b2b2b" stroke-width="1.4"/>
        <line x1="45" y1="70" x2="45" y2="12" stroke="#2b2b2b" stroke-width="1.4"/>
        <text x="52" y="22" font-size="10.5" fill="#2b2b2b">output current</text>
        <text x="180" y="84" font-size="10.5" fill="#2b2b2b" text-anchor="middle">time &#8594;</text>
        <path id="scope" fill="none" stroke="#3f7d4e" stroke-width="2" d=""/>
      </svg>

      <div class="explain" id="explain"></div>
    </div>
  </div>

  <footer>
    <div class="grp">
      <button id="prevBtn">&#8592; Prev</button>
      <button id="nextBtn">Next &#8594;</button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <span class="lab">reverse voltage</span>
      <button id="decBtn" class="vbtn">&minus;</button>
      <button id="incBtn" class="vbtn">+</button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <button id="geigerBtn">Enter Geiger mode</button>
      <button id="photonBtn" disabled>Send one photon</button>
    </div>
  </footer>
</div>

<script>

<script>
(function(){
  "use strict";
  var VMAX=100, VBR=60, GEIGERV=80, QUENCHV=42, SVGNS="http://www.w3.org/2000/svg";
  var JX=280, P_EDGE=132, N_EDGE=428, DEV_T=104, DEV_B=228;

  var _seed=987654321;
  function rnd(){ _seed=(_seed*1103515245+12345)&0x7fffffff; return _seed/0x7fffffff; }
  function reseed(){ _seed=987654321; }

  function Whalf(v){ return 14 + 62*Math.sqrt(Math.max(0,v)/VMAX); }

  var L=45,R=312;
  function px(v){ return L + (v/VMAX)*(R-L); }
  var IV_T=18, IV_B=158;
  function py(I){ return IV_B - I*(IV_B-IV_T); }
  function leak(v){ return 0.02 + 0.015*(v/VMAX); }
  function curveI(v){ if(v<=VBR) return leak(v); return Math.min(1, leak(VBR)+(v-VBR)*0.5); }

  function mk(t,a){ var e=document.createElementNS(SVGNS,t); for(var k in a) e.setAttribute(k,a[k]); return e; }
  function clear(g){ while(g.firstChild) g.removeChild(g.firstChild); }
  function $(id){ return document.getElementById(id); }

  var depl=$('depl'), arrows=$('arrows'), cores=$('cores'), carriers=$('carriers');
  var partsG=$('parts'), flashG=$('flash'), wireDots=$('wireDots'), blipDots=$('blipDots');
  var photonG=$('photonG'), amm=$('ammReading');
  var opdot=$('opdot'), scopeP=$('scope'), explain=$('explain'), stageTitle=$('stageTitle');
  var photonBtn=$('photonBtn'), incBtn=$('incBtn'), decBtn=$('decBtn');
  var wire=$('wire'), wireLen=wire.getTotalLength();
  var gfill=$('gfill');

  // static IV + gauge geometry
  (function(){
    var vbrX=px(VBR);
    var vl=$('vbrLine'); vl.setAttribute('x1',vbrX); vl.setAttribute('x2',vbrX);
    $('vbrLabel').setAttribute('x',vbrX);
    var rr=$('regR'); rr.setAttribute('x',vbrX); rr.setAttribute('width', R-vbrX);
    var d='',f=true;
    for(var v=0;v<=VMAX;v+=1.5){ d+=(f?'M':'L')+px(v).toFixed(1)+' '+py(curveI(v)).toFixed(1)+' '; f=false; }
    $('curve').setAttribute('d',d);
    $('gtick').setAttribute('x1',vbrX); $('gtick').setAttribute('x2',vbrX);
    $('gtickLab').setAttribute('x',vbrX);
    var gg=$('gfillGeiger'); gg.setAttribute('x',vbrX); gg.setAttribute('width',R-vbrX); gg.setAttribute('fill','#e2ecdf');
  })();

  // bulk mobile carriers (background population in the neutral regions)
  var bulk=[];
  (function(){
    var holeXs=[146,168,190,212,234,256], elecXs=[304,326,348,370,392,414], rows=[118,146,174,202,224];
    function add(x,y,type){
      var g=mk('g',{});
      g.appendChild(mk('circle',{cx:0,cy:0,r:7,fill:type==='h'?'#d1552f':'#2f6fb0'}));
      var t=mk('text',{x:0,y:3.5,'font-size':10,'text-anchor':'middle',fill:'#fff','font-weight':700});
      t.textContent=type==='h'?'+':'−'; g.appendChild(t);
      carriers.appendChild(g);
      bulk.push({el:g,bx:x,by:y,x:x,type:type,ph:rnd()*6.28});
    }
    for(var r=0;r<rows.length;r++){
      for(var i=0;i<holeXs.length;i++) add(holeXs[i],rows[r],'h');
      for(var j=0;j<elecXs.length;j++) add(elecXs[j],rows[r],'e');
    }
  })();

  var wdots=[];
  (function(){ for(var i=0;i<12;i++){ var c=mk('circle',{r:4,fill:'#e6b800',opacity:0}); wireDots.appendChild(c); wdots.push(c); } })();

  // ---------- live physics ----------
  var parts=[];    // free carriers in flight: {x,y,type,vx,vy,gen,en,ionized}
  var flashes=[];  // {x,y,age,kind:'ion'|'th'}
  var blips=[];    // leakage pulses on the wire: {t}
  var NSCOPE=200, scope=[]; for(var s0=0;s0<NSCOPE;s0++) scope.push(0);
  var bump=0, fc=0, wirePhase=0, thermalClock=0;

  // behavior of the current step
  var BH={seeds:false, mult:'none', inject:false, thermalEvery:999999};
  var SV={v:0};                       // animated voltage value (anime.js tweens this)
  var dispW=Whalf(0), lastStaticW=-99;

  function multOf(v){ return v>=VBR? 'div' : (v>=45? 'finite' : 'none'); }

  function spawnPair(x,y,gen){
    parts.push({x:x,y:y,type:'e',vx:0.3,vy:(rnd()-0.5)*0.5,gen:gen,en:0,ionized:false});
    parts.push({x:x,y:y,type:'h',vx:-0.3,vy:(rnd()-0.5)*0.5,gen:gen,en:0,ionized:false});
  }
  function thermalPair(){
    var W=dispW;
    var x=JX+(rnd()*2-1)*(W*0.7), y=DEV_T+8+rnd()*(DEV_B-DEV_T-16);
    spawnPair(x,y,0);
    flashes.push({x:x,y:y,age:0,kind:'th'});
  }

  function physics(){
    var v=SV.v, f=v/VMAX, W=dispW;
    var mult=BH.mult==='auto'? multOf(v) : BH.mult;

    // thermal generation
    if(BH.seeds){ thermalClock--; if(thermalClock<=0){ thermalPair(); thermalClock=BH.thermalEvery*(0.6+rnd()*0.8); } }

    // avalanche self-sustains: generation outpaces exit while v stays above breakdown
    var active = parts.length>=6 && mult==='div';
    if(active && parts.length<16) spawnPair(JX+(rnd()*2-1)*W*0.5, DEV_T+8+rnd()*(DEV_B-DEV_T-16), 2);

    var next=[];
    for(var i=0;i<parts.length;i++){
      var p=parts[i];
      var dir = p.type==='e'? 1:-1;
      var inD = Math.abs(p.x-JX)<W;
      var acc = inD? (0.028+0.16*f) : 0.05;
      p.vx += dir*acc;
      var cap = 1.0+3.4*f;
      if(p.vx>cap)p.vx=cap; if(p.vx<-cap)p.vx=-cap;
      p.x+=p.vx; p.y+=p.vy;
      if(p.y<DEV_T+4){p.y=DEV_T+4;p.vy=Math.abs(p.vy);} if(p.y>DEV_B-4){p.y=DEV_B-4;p.vy=-Math.abs(p.vy);}
      if(inD) p.en += Math.abs(p.vx);

      // impact ionization
      if(inD && p.en>46){
        if(mult==='div' && parts.length+next.length<40){
          p.en=0;
          spawnPair(p.x,p.y,p.gen+1);
          flashes.push({x:p.x,y:p.y,age:0,kind:'ion'});
        } else if(mult==='finite' && !p.ionized && p.gen===0){
          p.ionized=true; p.en=0;
          spawnPair(p.x,p.y,1);
          flashes.push({x:p.x,y:p.y,age:0,kind:'ion'});
        } else p.en=0;
      }

      // collection at the contacts
      if(p.type==='h' && p.x<P_EDGE+4){ onExit(active); continue; }
      if(p.type==='e' && p.x>N_EDGE-4){ onExit(active); continue; }
      next.push(p);
    }
    parts=next;

    function onExit(act){ if(!act){ if(blips.length<4) blips.push({t:0.02}); bump=Math.min(0.14,bump+0.05); } }

    bump*=0.94;
    // below breakdown the multiplication is finite, so the current stays tiny
    // no matter how many transient carriers are visible; only the divergent
    // mode can reach the large saturated current
    var level;
    if(mult==='div') level = Math.min(1, parts.length/13);
    else level = Math.min(0.16, parts.length*0.012 + bump);
    scope.push(level); scope.shift();
    return level;
  }

  // ---------- rendering ----------
  function drawStatics(W){
    clear(cores);
    var coreYs=[120,150,180,210];
    for(var d=10; d<W-2; d+=20){
      for(var k=0;k<coreYs.length;k++){
        [[JX-d,'−'],[JX+d,'+']].forEach(function(c){
          var g=mk('g',{});
          g.appendChild(mk('circle',{cx:c[0],cy:coreYs[k],r:6,fill:'none',stroke:'#8a8272','stroke-width':1.4}));
          var t=mk('text',{x:c[0],y:coreYs[k]+3,'font-size':9,'text-anchor':'middle',fill:'#8a8272','font-weight':700});
          t.textContent=c[1]; g.appendChild(t); cores.appendChild(g);
        });
      }
    }
    clear(arrows);
    var v=SV.v;
    if(v>2){
      var aYs=[128,167,206];
      var op=(0.18+0.72*(v/VMAX));
      for(var a=0;a<aYs.length;a++)
        arrows.appendChild(mk('line',{x1:JX+W-6,y1:aYs[a],x2:JX-W+6,y2:aYs[a],stroke:'#6f4aa6','stroke-width':(1.4+1.6*v/VMAX).toFixed(1),'marker-end':'url(#fa)',opacity:op.toFixed(2)}));
    }
  }

  function draw(){
    fc++;
    var v=SV.v;
    var target=Whalf(v); dispW += (target-dispW)*0.16;
    depl.setAttribute('x', JX-dispW); depl.setAttribute('width', 2*dispW);
    if(Math.abs(dispW-lastStaticW)>0.5){ drawStatics(dispW); lastStaticW=dispW; }

    var level=physics();
    var big = level>0.45;

    // bulk carriers
    for(var i=0;i<bulk.length;i++){
      var b=bulk[i];
      if(big){
        b.x += (b.type==='h'? -2.4 : 2.4);
        if(b.type==='h' && b.x < P_EDGE) b.x = JX - 8 - rnd()*12;
        if(b.type==='e' && b.x > N_EDGE) b.x = JX + 8 + rnd()*12;
        b.el.style.display='';
        b.el.setAttribute('transform','translate('+b.x.toFixed(1)+','+(b.by+1.6*Math.cos(fc*0.05+b.ph*1.3)).toFixed(1)+')');
      } else {
        b.x += (b.bx-b.x)*0.2;
        var vis = b.type==='h' ? (b.bx < JX-dispW-8) : (b.bx > JX+dispW+8);
        if(!vis){ b.el.style.display='none'; continue; }
        b.el.style.display='';
        b.el.setAttribute('transform','translate('+(b.x+1.7*Math.sin(fc*0.06+b.ph)).toFixed(1)+','+(b.by+1.5*Math.cos(fc*0.05+b.ph*1.3)).toFixed(1)+')');
      }
    }

    // free carriers in flight
    clear(partsG);
    for(var c=0;c<parts.length;c++){
      var p=parts[c];
      partsG.appendChild(mk('circle',{cx:p.x.toFixed(1),cy:p.y.toFixed(1),r:5,fill:p.type==='e'?'#2f6fb0':'#d1552f',stroke:'#fff','stroke-width':1}));
    }

    // flashes: yellow ring = impact ionization; soft gray ring = thermal generation
    clear(flashG); var nf=[];
    for(var f2=0;f2<flashes.length;f2++){
      var fl=flashes[f2]; fl.age++;
      if(fl.age<16){ nf.push(fl);
        flashG.appendChild(mk('circle',{cx:fl.x.toFixed(1),cy:fl.y.toFixed(1),
          r:(3+fl.age*(fl.kind==='ion'?0.9:0.6)).toFixed(1),fill:'none',
          stroke: fl.kind==='ion'?'#e6c200':'#9a938a','stroke-width':2.2,
          opacity:(1-fl.age/16).toFixed(2)}));
      }
    }
    flashes=nf;

    // wire: large current = marching dots; leakage = single slow blips
    if(big) wirePhase+=0.013;
    for(var w=0;w<wdots.length;w++){
      if(!big){ wdots[w].setAttribute('opacity',0); continue; }
      var pt=wire.getPointAtLength(((w/wdots.length)+wirePhase)%1*wireLen);
      wdots[w].setAttribute('cx',pt.x); wdots[w].setAttribute('cy',pt.y); wdots[w].setAttribute('opacity',0.95);
    }
    clear(blipDots); var nb=[];
    for(var bl=0;bl<blips.length;bl++){
      var q=blips[bl]; q.t+=0.006;
      if(q.t<1){ nb.push(q);
        var bp=wire.getPointAtLength(q.t*wireLen);
        blipDots.appendChild(mk('circle',{cx:bp.x,cy:bp.y,r:4,fill:'#e6b800',opacity:0.7}));
      }
    }
    blips=nb;

    // ammeter
    amm.textContent = big? 'current: large' : (level>0.02? 'current: tiny leakage' : 'current: none');

    // gauge
    gfill.setAttribute('width', Math.max(0,(px(v)-L)));

    // IV operating dot: x follows the voltage, y follows the actual current
    opdot.setAttribute('cx',px(v));
    opdot.setAttribute('cy',py(Math.min(1,Math.max(level, leak(v)*0.4))));

    // rolling oscilloscope
    var d='',first=true, step=(R-L)/NSCOPE;
    for(var sx=0;sx<NSCOPE;sx++){
      d+=(first?'M':'L')+(L+sx*step).toFixed(1)+' '+(70-scope[sx]*52).toFixed(1)+' ';
      first=false;
    }
    scopeP.setAttribute('d',d);
  }

  // ---------- steps ----------
  var STEPS=[
    {id:'junction', v:0, seeds:false, mult:'none',
     title:'1 / 10  The pn junction at rest',
     text:'<span class="t">A pn junction and its depletion region</span>The p region holds mobile holes, drawn as orange discs with a plus sign. The n region holds mobile electrons, drawn as blue discs with a minus sign. At the junction the mobile carriers diffuse across, recombine, and leave a thin layer with no mobile carrier. This layer is the depletion region. The depletion region holds only fixed charged cores: negative acceptor cores on the p side, positive donor cores on the n side. No voltage is applied, so no current flows.'},
    {id:'seeds', v:16, seeds:true, mult:'none',
     title:'2 / 10  Heat creates seed carriers',
     text:'<span class="t">Thermal generation and the leakage current</span>A small reverse voltage is applied. The crystal is warm, and heat continuously lifts a few electrons out of their bonds. Each lift creates one free electron and one free hole inside the depletion region; a gray ring marks each such event. This process is thermal generation. The electric field sweeps the electron to the n contact and the hole to the p contact. Each crossing carries a very small charge around the circuit, one faint dot on the wire. These few carriers form the leakage current, and they are the seed carriers for everything that follows.'},
    {id:'widen', v:36, seeds:true, mult:'none',
     title:'3 / 10  Reverse bias widens the depletion region',
     text:'<span class="t">A wider region and a stronger field</span>A larger reverse voltage pulls the mobile holes and the mobile electrons further from the junction, so the depletion region widens. More fixed cores are exposed. The electric field inside the depletion region grows stronger, shown by the arrows, and the seed carriers cross faster. The leakage current stays tiny, because heat sets the number of seed carriers, and the voltage does not change that number.'},
    {id:'finite', v:52, seeds:true, mult:'finite',
     title:'4 / 10  Below breakdown: finite multiplication',
     text:'<span class="t">Impact ionization with a finite multiplication factor</span>The field now accelerates a seed carrier to a high kinetic energy. The carrier hits a lattice atom and knocks one new electron-hole pair free; a yellow ring marks the collision. This collision is impact ionization. The new pair drifts to the contacts, but the chain stops after this step. The multiplication factor, the ratio of the collected current to the seed current, is still finite. The current grows a little and stays small.'},
    {id:'breakdown', v:VBR, seeds:true, mult:'div',
     title:'5 / 10  Breakdown: the multiplication diverges',
     text:'<span class="t">The tiny leakage current becomes a large current</span>At the breakdown voltage each carrier creates on average more than one new carrier before it leaves the depletion region, so the chain no longer stops. The multiplication factor diverges. The same few thermal seed carriers are multiplied into a large current. The large current is the multiplied leakage current, not a new current from nowhere. The external circuit alone limits its size.'},
    {id:'geiger', v:GEIGERV, seeds:false, mult:'div',
     title:'6 / 10  Geiger mode: above breakdown, no current',
     text:'<span class="t">Biased above breakdown, carrying no current</span>Geiger mode holds the reverse voltage above the breakdown voltage. At this moment the depletion region holds no free carrier, so no current flows, and the operating point on the curve stays at zero current. The field is strong enough to multiply the next free carrier without limit. One single carrier will start a self-sustaining avalanche. That carrier can come from one photon.'},
    {id:'photon', v:GEIGERV, seeds:false, mult:'div', photon:true,
     title:'7 / 10  One photon triggers the avalanche',
     text:'<span class="t">One photon, one self-sustaining avalanche</span>One photon enters the depletion region and creates one electron-hole pair. The field accelerates these two carriers, impact ionization multiplies them, and the avalanche becomes self-sustaining: the carrier generation rate exceeds the rate at which carriers leave the region. A large current flows through the junction and around the circuit, and the output shows one pulse. The pulse has the same size for every photon. The avalanche keeps running, because the voltage stays above the breakdown voltage.'},
    {id:'quench', v:QUENCHV, seeds:false, mult:'auto',
     title:'8 / 10  Quench: the series resistor stops the avalanche',
     text:'<span class="t">Quenching stops the avalanche</span>The diode is connected in series with a resistor, and the supply voltage is fixed, so the resistor voltage and the diode voltage always add up to the same total. The avalanche current flows through the resistor, and this current times the resistance is a large voltage drop across the resistor. That drop is taken away from the diode, so the voltage across the diode falls below the breakdown voltage. The field weakens, the carriers no longer reach the energy for impact ionization, and the current falls to zero. The avalanche current switches itself off through the resistor. This step is quenching.'},
    {id:'reset', v:GEIGERV, seeds:false, mult:'div',
     title:'9 / 10  Reset: the voltage recovers',
     text:'<span class="t">Back above breakdown</span>The avalanche current has stopped, so the resistor no longer takes any voltage, and the voltage across the diode rises back above the breakdown voltage. The depletion region again holds no free carrier, and no current flows. The detector can register the next photon. The time from the avalanche to this recovered state is the dead time: a photon that arrives inside this interval produces no count.'},
    {id:'darkcount', v:GEIGERV, seeds:true, mult:'div', thermalEvery:260, dark:true,
     title:'10 / 10  Dark count: a thermal seed, no photon',
     text:'<span class="t">Heat triggers false counts</span>Thermal generation does not stop in Geiger mode. A thermally generated pair appears inside the depletion region with no photon present, and the field multiplies this thermal seed exactly like a photon-generated carrier. The circuit registers a count, the same pulse as for a real photon. This false count is a dark count. Cooling the SPAD lowers the thermal generation rate and with it the dark-count rate. The demonstration repeats: seed, avalanche, quench, reset.'}
  ];
  var idx=0, timers=[], frozen=false;

  function later(fn,ms){ if(frozen){ return; } timers.push(setTimeout(fn,ms)); }
  function cancelAll(){ timers.forEach(clearTimeout); timers=[]; if(window.anime) anime.remove(SV); }

  function tweenV(target,dur){
    if(frozen){ SV.v=target; return; }
    anime({targets:SV, v:target, duration:dur||700, easing:'easeInOutQuad'});
  }

  function firePhoton(){
    var W=Whalf(GEIGERV);
    var tx=JX+(rnd()*2-1)*W*0.4, ty=DEV_T+16+rnd()*(DEV_B-DEV_T-50);
    if(frozen){
      photonG.setAttribute('opacity','1');
      photonG.setAttribute('transform','translate('+tx+','+ty+')');
      spawnPair(tx,ty,0); flashes.push({x:tx,y:ty,age:0,kind:'ion'});
      return;
    }
    photonG.setAttribute('transform','translate('+(tx+120)+','+(ty-140)+')');
    photonG.setAttribute('opacity','1');
    anime({targets:photonG, translateX:tx, translateY:ty, duration:520, easing:'linear',
      update:function(a){ /* anime writes transform */ },
      complete:function(){
        photonG.setAttribute('opacity','0');
        spawnPair(tx,ty,0);
        flashes.push({x:tx,y:ty,age:0,kind:'ion'});
      }});
    // anime sets translate via transform on the group
  }

  function setStep(i, instant){
    cancelAll();
    idx=i; var st=STEPS[i];
    BH={seeds:!!st.seeds, mult:st.mult, thermalEvery: st.thermalEvery||150};
    if(st.id!=='quench') parts=[];   // in the quench step the running avalanche dies on screen
    flashes=[]; blips=[]; bump=0; thermalClock=30;
    photonG.setAttribute('opacity','0');
    explain.innerHTML=st.text; stageTitle.textContent=st.title;
    photonBtn.disabled = !(st.id==='geiger'||st.id==='reset');
    incBtn.disabled = decBtn.disabled = (i>=5);
    if(instant){ SV.v=st.v; } else { tweenV(st.v, 800); }
    if(st.photon){ later(firePhoton, instant?0:900); if(instant){ firePhoton(); } }
    if(st.dark && !frozen) darkLoop();
    if(!instant && window.anime){
      explain.style.opacity=0;
      anime({targets:explain, opacity:[0,1], duration:450, easing:'linear'});
    }
  }

  function darkLoop(){
    // wait for a thermal seed to start an avalanche, then quench and reset, repeatedly
    later(function check(){
      if(parts.length>10){
        later(function(){ tweenV(QUENCHV,450); }, 900);
        later(function(){ tweenV(GEIGERV,450); }, 2000);
        later(function(){ if(STEPS[idx].dark) darkLoop(); }, 2600);
      } else if(STEPS[idx].dark){ later(check, 300); }
    }, 300);
  }

  // free play: +/- voltage in the sweep steps
  function sweepTo(v){
    cancelAll();
    var st = v<8? STEPS[0] : v<30? STEPS[1] : v<45? STEPS[2] : v<VBR? STEPS[3] : STEPS[4];
    idx=STEPS.indexOf(st);
    BH={seeds: v>=8, mult: multOf(v), thermalEvery:150};
    explain.innerHTML=st.text; stageTitle.textContent=st.title;
    photonBtn.disabled=true; incBtn.disabled=decBtn.disabled=false;
    tweenV(v, 500);
  }

  $('nextBtn').onclick=function(){ if(idx<STEPS.length-1) setStep(idx+1); };
  $('prevBtn').onclick=function(){ if(idx>0) setStep(idx-1); };
  incBtn.onclick=function(){ sweepTo(Math.min(VBR+4, SV.v+6)); };
  decBtn.onclick=function(){ sweepTo(Math.max(0, SV.v-6)); };
  $('geigerBtn').onclick=function(){ setStep(5); };
  photonBtn.onclick=function(){
    if(photonBtn.disabled) return;
    setStep(6);                                  // photon + avalanche
    later(function(){ setStep(7); }, 2600);      // quench
    later(function(){ setStep(8); }, 4400);      // reset
  };

  // ---------- boot ----------
  function frame(){ draw(); if(!frozen) requestAnimationFrame(frame); }

  var q=location.search.match(/shot=([a-z\-]+)/);
  if(q){
    frozen=true; document.body.classList.add('frozen');
    var found=-1;
    for(var i=0;i<STEPS.length;i++){ if(STEPS[i].id===q[1]){ found=i; break; } }
    if(found<0) found=0;
    reseed();
    setStep(found, true);
    dispW=Whalf(SV.v); lastStaticW=-99;
    var st=STEPS[found];
    if(st.id==='breakdown'||st.id==='darkcount'){ spawnPair(JX,166,0); }
    var steps = (st.mult==='div' && (st.photon||st.id==='breakdown'||st.id==='darkcount'))? 130 : 90;
    for(var k=0;k<steps;k++) draw();
  } else {
    setStep(0, true);
    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
