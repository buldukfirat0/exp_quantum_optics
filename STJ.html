<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STJ</title>
<style>
  :root {
    --bg: #e9e6df;
    --panel: #f4f2ec;
    --ink: #23272e;
    --muted: #5d6570;
    --line: #c6c0b2;
    --e: #2d5fb8;         /* quasiparticle blue */
    --pair: #1f7a5c;      /* Cooper pair green */
    --photon: #b7791f;    /* amber */
    --term: #0f766e;      /* teal terms */
    --signal: #15803d;    /* green output */
    --field: #6d28d9;     /* violet bias */
    --wave: #0e7490;      /* magnetic-field wave, cyan */
    --hot: #c02626;
    --edge: #5a5346;
  }
  :root[data-theme="dark"] {
    --bg: #171b20;
    --panel: #262b31;
    --ink: #ebe7dd;
    --muted: #a1abb5;
    --line: #3b414a;
    --e: #6ea3f2;
    --pair: #46c99a;
    --photon: #e3a94e;
    --term: #37c6b8;
    --signal: #51c77d;
    --field: #ab8ffb;
    --wave: #38bdf8;
    --hot: #f06b6b;
  }
  html, body { transition: background-color .3s ease; }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    height: 100vh; overflow: hidden; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start;
    padding: 10px 12px 12px;
  }
  .bar { width: min(1250px, 97vw); display: flex; align-items: center; gap: 12px; padding: 4px 6px 8px; }
  .bar h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
  .bar .spacer { margin-left: auto; }
  .bar button {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 15px; font-size: 15px; cursor: pointer;
  }
  .bar button:hover { border-color: var(--photon); }
  .bar button:focus-visible { outline: 2px solid var(--photon); outline-offset: 2px; }
  .controls button { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .controls .chip { min-width: 34px; padding: 7px 0; text-align: center; font-size: 14px; }
  .controls .chip.active { border-color: var(--photon); color: var(--photon); font-weight: 700; }

  svg { width: min(1250px, 97vw); height: auto; max-height: calc(100vh - 110px); display: block; }

  .cap   { font-size: 29px; font-weight: 700; fill: var(--ink); }
  .cap2  { font-size: 20px; fill: var(--muted); }
  .face  { font-size: 20px; font-weight: 700; fill: #2c2620; }
  .facesub { font-size: 16.5px; font-weight: 600; fill: #4a4236; }
  .bom   { font-size: 18px; fill: var(--ink); }
  .term  { font-size: 18px; font-weight: 600; fill: var(--term); }
  .lbl   { font-size: 18px; fill: var(--muted); }
  .rlab  { font-size: 20px; font-weight: 700; }
  .small { font-size: 16px; fill: var(--muted); }
  .badge { font-size: 20px; font-weight: 700; }
  .volt  { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
           font-size: 17px; font-weight: 600; fill: var(--field); }

  .fade { opacity: 0; transition: opacity .5s ease; }
  .fade.on { opacity: 1; }
  .noanim .fade { transition: none !important; }
</style>
</head>
<body>

<div class="bar">
  <h1>Superconducting tunnel junction (STJ)</h1>
  <span class="spacer"></span>
  <button id="replay" type="button">Replay</button>
</div>
<div class="bar controls" role="group" aria-label="step controls">
  <button id="prev" type="button" aria-label="previous step">&#9664;</button>
  <button id="play" type="button" aria-label="pause or play">&#10074;&#10074;</button>
  <button id="next" type="button" aria-label="next step">&#9654;</button>
  <span id="chips" style="display:flex; gap:6px; flex-wrap:wrap;"></span>
</div>

<svg viewBox="0 0 1280 762" role="img" aria-label="Superconducting tunnel junction, built then operated">

  <text id="cap"  class="cap"  x="640" y="42" text-anchor="middle"></text>
  <text id="cap2" class="cap2" x="640" y="74" text-anchor="middle"></text>

  <!-- temperature badge -->
  <g id="tempbadge" class="fade">
    <rect x="40" y="100" width="196" height="66" rx="10" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/>
    <text class="badge" x="58" y="132" fill="var(--term)">T &#8776; 0.4 K</text>
    <text class="small" x="58" y="154">below T<tspan baseline-shift="sub" font-size="11">c</tspan></text>
  </g>

  <!-- ===== 3D device stack ===== -->
  <g id="Lsub" class="fade">
    <polygon points="300,496 660,496 810,408 450,408" fill="#c9c3b6" stroke="var(--edge)" stroke-width="1.2" stroke-linejoin="round"/>
    <polygon points="660,496 810,408 810,472 660,560" fill="#9c9689" stroke="var(--edge)" stroke-width="1.2" stroke-linejoin="round"/>
    <polygon points="300,496 660,496 660,560 300,560" fill="#b3ada0" stroke="var(--edge)" stroke-width="1.2" stroke-linejoin="round"/>
  </g>
  <g id="Lbase" class="fade">
    <polygon points="300,442 660,442 810,354 450,354" fill="#e8d8b3" stroke="var(--edge)" stroke-width="1.2" stroke-linejoin="round"/>
    <polygon points="660,442 810,354 810,408 660,496" fill="#c2ab7c" stroke="var(--edge)" stroke-width="1.2" stroke-linejoin="round"/>
    <polygon points="300,442 660,442 660,496 300,496" fill="#d9c398" stroke="var(--edge)" stroke-width="1.2" stroke-linejoin="round"/>
  </g>
  <g id="Lbar" class="fade">
    <polygon points="300,426 660,426 810,338 450,338" fill="#d29434" stroke="var(--edge)" stroke-width="1.2" stroke-linejoin="round"/>
    <polygon points="660,426 810,338 810,354 660,442" fill="#9f6a17" stroke="var(--edge)" stroke-width="1.2" stroke-linejoin="round"/>
    <polygon points="300,426 660,426 660,442 300,442" fill="#bd7f27" stroke="var(--edge)" stroke-width="1.2" stroke-linejoin="round"/>
  </g>
  <g id="Ltop" class="fade">
    <polygon points="300,372 660,372 810,284 450,284" fill="#e8d8b3" stroke="var(--edge)" stroke-width="1.2" stroke-linejoin="round"/>
    <polygon points="660,372 810,284 810,338 660,426" fill="#c2ab7c" stroke="var(--edge)" stroke-width="1.2" stroke-linejoin="round"/>
    <polygon points="300,372 660,372 660,426 300,426" fill="#d9c398" stroke="var(--edge)" stroke-width="1.2" stroke-linejoin="round"/>
  </g>

  <!-- on-face layer labels (build only) -->
  <g id="labSub" class="fade"><text class="face" x="480" y="533" text-anchor="middle" stroke="#b3ada0" stroke-width="3.5" paint-order="stroke">substrate</text></g>
  <g id="labBase" class="fade"><text class="face" x="480" y="474" text-anchor="middle" stroke="#d9c398" stroke-width="3.5" paint-order="stroke">base electrode (superconductor)</text></g>
  <g id="labTop" class="fade">
    <text class="face" x="480" y="398" text-anchor="middle" stroke="#d9c398" stroke-width="3.5" paint-order="stroke">top electrode (superconductor)</text>
    <text class="facesub" x="480" y="418" text-anchor="middle" stroke="#d9c398" stroke-width="3.5" paint-order="stroke">absorber: catches the photon</text>
  </g>

  <!-- barrier detail leader (build only), in the empty space left of the device -->
  <g id="barLead" class="fade">
    <line x1="298" y1="434" x2="254" y2="434" stroke="var(--photon)" stroke-width="1.6"/>
    <text class="facesub" x="246" y="430" text-anchor="end" fill="var(--photon)" font-weight="700">tunnel barrier</text>
    <text class="small" x="246" y="450" text-anchor="end" fill="var(--photon)">insulator, &#8776; 1 nm</text>
  </g>

  <!-- magnetic field: a single arrow below the device -->
  <g id="fieldArrow" style="opacity:0">
    <text class="rlab" x="336" y="617" text-anchor="end" fill="var(--wave)">B</text>
    <line x1="352" y1="610" x2="700" y2="610" stroke="var(--wave)" stroke-width="3.5"/>
    <path d="M 688,602 L 704,610 L 688,618" fill="none" stroke="var(--wave)" stroke-width="3.5" stroke-linejoin="round"/>
    <text class="lbl" x="352" y="650" fill="var(--wave)">magnetic field B applied, parallel to the barrier</text>
  </g>

  <!-- bias + ammeter, on the left, with contact wires -->
  <g id="circuit" class="fade">
    <path d="M 300,386 L 200,386 L 200,408" fill="none" stroke="var(--field)" stroke-width="2.6"/>
    <line x1="182" y1="410" x2="218" y2="410" stroke="var(--field)" stroke-width="3"/>
    <line x1="189" y1="422" x2="211" y2="422" stroke="var(--field)" stroke-width="5.5"/>
    <path d="M 200,424 L 200,436" fill="none" stroke="var(--field)" stroke-width="2.6"/>
    <circle cx="200" cy="454" r="17" fill="var(--panel)" stroke="var(--field)" stroke-width="2.2"/>
    <text class="volt" x="200" y="460" text-anchor="middle" fill="var(--field)">I</text>
    <path d="M 200,471 L 200,482 L 300,482" fill="none" stroke="var(--field)" stroke-width="2.6"/>
    <text class="volt" x="174" y="418" text-anchor="end" fill="var(--field)">bias V</text>
    <text class="small" x="296" y="372" text-anchor="end" fill="var(--field)">contact wires</text>
  </g>

  <!-- Cooper pairs -->
  <g id="cpTop">
    <g class="cp" style="opacity:0" fill="var(--pair)" stroke="var(--pair)"><line x1="339" y1="396" x2="353" y2="396" stroke-width="2.8"/><circle cx="339" cy="396" r="7.5"/><circle cx="353" cy="396" r="7.5"/></g>
    <g class="cp" style="opacity:0" fill="var(--pair)" stroke="var(--pair)"><line x1="426" y1="410" x2="440" y2="410" stroke-width="2.8"/><circle cx="426" cy="410" r="7.5"/><circle cx="440" cy="410" r="7.5"/></g>
    <g class="cp" style="opacity:0" fill="var(--pair)" stroke="var(--pair)"><line x1="516" y1="394" x2="530" y2="394" stroke-width="2.8"/><circle cx="516" cy="394" r="7.5"/><circle cx="530" cy="394" r="7.5"/></g>
    <g class="cp" style="opacity:0" fill="var(--pair)" stroke="var(--pair)"><line x1="598" y1="408" x2="612" y2="408" stroke-width="2.8"/><circle cx="598" cy="408" r="7.5"/><circle cx="612" cy="408" r="7.5"/></g>
    <g class="cp" style="opacity:0" fill="var(--pair)" stroke="var(--pair)"><line x1="463" y1="418" x2="477" y2="418" stroke-width="2.8"/><circle cx="463" cy="418" r="7.5"/><circle cx="477" cy="418" r="7.5"/></g>
  </g>
  <g id="cpBase">
    <g class="cp" style="opacity:0" fill="var(--pair)" stroke="var(--pair)"><line x1="343" y1="470" x2="357" y2="470" stroke-width="2.8"/><circle cx="343" cy="470" r="7.5"/><circle cx="357" cy="470" r="7.5"/></g>
    <g class="cp" style="opacity:0" fill="var(--pair)" stroke="var(--pair)"><line x1="390" y1="486" x2="404" y2="486" stroke-width="2.8"/><circle cx="390" cy="486" r="7.5"/><circle cx="404" cy="486" r="7.5"/></g>
  </g>

  <!-- Cooper-pair definition callout (step 6) -->
  <g id="cpDef" class="fade">
    <text class="small" x="60" y="228" text-anchor="middle" fill="var(--e)">e&#8315;</text>
    <text class="small" x="100" y="228" text-anchor="middle" fill="var(--e)">e&#8315;</text>
    <circle cx="60" cy="250" r="7.5" fill="var(--e)"/>
    <circle cx="100" cy="250" r="7.5" fill="var(--e)"/>
    <line x1="120" y1="250" x2="162" y2="250" stroke="var(--muted)" stroke-width="2.2"/>
    <path d="M 152,244 L 164,250 L 152,256" fill="none" stroke="var(--muted)" stroke-width="2.2" stroke-linejoin="round"/>
    <g fill="var(--pair)" stroke="var(--pair)"><line x1="182" y1="250" x2="196" y2="250" stroke-width="2.8"/><circle cx="182" cy="250" r="7.5"/><circle cx="196" cy="250" r="7.5"/></g>
    <text class="small" x="188" y="276" text-anchor="middle" fill="var(--pair)" font-weight="700">Cooper pair</text>
    <text class="small" x="52" y="304">two electrons bind below T<tspan baseline-shift="sub" font-size="11">c</tspan>,</text>
    <text class="small" x="52" y="326">carrying the supercurrent</text>
  </g>

  <!-- incident photon (absolute coords; anime.js offsets translateY) -->
  <g id="photon" style="opacity:0">
    <path d="M 556,182 q 10,15 0,30 q -10,15 0,30 q 10,15 0,30 q -10,15 0,30" fill="none" stroke="var(--photon)" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 550,300 L 556,316 L 562,300" fill="none" stroke="var(--photon)" stroke-width="3.2" stroke-linejoin="round"/>
    <text class="lbl" x="572" y="196" fill="var(--photon)" font-weight="700">photon h&nu;</text>
  </g>

  <!-- intact pairs blocked at the barrier (step 11) -->
  <g id="bouncePairs" style="opacity:0">
    <g fill="var(--pair)" stroke="var(--pair)"><line x1="556" y1="416" x2="570" y2="416" stroke-width="2.8"/><circle cx="556" cy="416" r="7.5"/><circle cx="570" cy="416" r="7.5"/></g>
    <g fill="var(--pair)" stroke="var(--pair)"><line x1="606" y1="416" x2="620" y2="416" stroke-width="2.8"/><circle cx="606" cy="416" r="7.5"/><circle cx="620" cy="416" r="7.5"/></g>
  </g>

  <!-- quasiparticles born in the top electrode, then tunnel down -->
  <g id="quasilab" class="fade"><text class="term" x="300" y="182" fill="var(--e)">quasiparticles (single carriers from broken pairs)</text></g>
  <g id="quasi">
    <circle cx="420" cy="390" r="7.5" fill="var(--e)" style="opacity:0"/><circle cx="445" cy="404" r="7.5" fill="var(--e)" style="opacity:0"/>
    <circle cx="478" cy="388" r="7.5" fill="var(--e)" style="opacity:0"/><circle cx="505" cy="402" r="7.5" fill="var(--e)" style="opacity:0"/>
    <circle cx="540" cy="392" r="7.5" fill="var(--e)" style="opacity:0"/><circle cx="512" cy="418" r="7.5" fill="var(--e)" style="opacity:0"/>
    <circle cx="452" cy="416" r="7.5" fill="var(--e)" style="opacity:0"/><circle cx="486" cy="420" r="7.5" fill="var(--e)" style="opacity:0"/>
    <circle cx="425" cy="418" r="7.5" fill="var(--e)" style="opacity:0"/><circle cx="470" cy="390" r="7.5" fill="var(--e)" style="opacity:0"/>
    <circle cx="528" cy="406" r="7.5" fill="var(--e)" style="opacity:0"/><circle cx="400" cy="404" r="7.5" fill="var(--e)" style="opacity:0"/>
  </g>

  <!-- ===== right column: build legend (build only) ===== -->
  <g id="bom" class="fade">
    <rect x="852" y="110" width="416" height="200" rx="10" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/>
    <text class="term" x="872" y="140" fill="var(--ink)" font-weight="700">device stack, top to bottom</text>
  </g>
  <g id="bom1" class="fade"><rect x="872" y="156" width="22" height="22" fill="#d9c398" stroke="var(--edge)" stroke-width="1"/><text class="bom" x="904" y="174">top electrode: superconductor, absorber</text></g>
  <g id="bom2" class="fade"><rect x="872" y="192" width="22" height="22" fill="#bd7f27" stroke="var(--edge)" stroke-width="1"/><text class="bom" x="904" y="210">tunnel barrier: insulator, &#8776; 1 nm</text></g>
  <g id="bom3" class="fade"><rect x="872" y="228" width="22" height="22" fill="#d9c398" stroke="var(--edge)" stroke-width="1"/><text class="bom" x="904" y="246">base electrode: superconductor</text></g>
  <g id="bom4" class="fade"><rect x="872" y="264" width="22" height="22" fill="#b3ada0" stroke="var(--edge)" stroke-width="1"/><text class="bom" x="904" y="282">substrate: support wafer</text></g>

  <!-- takeaway -->
  <g id="takeaway" class="fade">
    <text class="term" x="1066" y="404" text-anchor="middle" font-weight="700" fill="var(--term)">pulse charge &#8733; N &#8733; photon energy</text>
    <text class="term" x="1066" y="428" text-anchor="middle" font-weight="700" fill="var(--term)">energy resolving, full photon-number resolution</text>
  </g>

  <!-- current scope -->
  <g id="scope" class="fade">
    <text class="lbl" x="1066" y="456" text-anchor="middle">tunneling current I</text>
    <rect x="892" y="468" width="360" height="224" rx="10" fill="var(--panel)" stroke="var(--line)" stroke-width="1.5"/>
    <line x1="918" y1="660" x2="1228" y2="660" stroke="var(--muted)" stroke-width="1.8"/>
    <line x1="918" y1="660" x2="918" y2="488" stroke="var(--muted)" stroke-width="1.8"/>
    <text class="small" x="926" y="504">I</text>
    <text class="small" x="1224" y="680" text-anchor="end">time</text>
    <line x1="918" y1="660" x2="1228" y2="660" stroke="var(--signal)" stroke-width="2.6" opacity="0.5"/>
  </g>
  <path id="trace_area" d="M 992,660 L 1034,522 L 1132,522 L 1174,660 Z" fill="var(--signal)" style="opacity:0"/>
  <path id="trace_rise" d="M 918,660 L 992,660 L 1034,522 L 1132,522 L 1174,660 L 1228,660" fill="none" stroke="var(--signal)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" style="opacity:0"/>
  <text id="trace_note" class="fade small" x="1082" y="514" text-anchor="middle" fill="var(--signal)" font-weight="700">height &#8733; N quasiparticles</text>
  <text id="chargeNote" class="fade small" x="1083" y="614" text-anchor="middle" fill="var(--signal)" font-weight="700">area = total charge Q = N &#183; e</text>

</svg>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function on(id, v) { var el = $(id); if (el) el.classList.toggle('on', !!v); }

  var qDots = Array.prototype.slice.call(document.querySelectorAll('#quasi circle'));
  var cpTopEls = Array.prototype.slice.call(document.querySelectorAll('#cpTop .cp'));
  var cpBaseEls = Array.prototype.slice.call(document.querySelectorAll('#cpBase .cp'));
  var photonEl = $('photon'), fieldEl = $('fieldArrow'), bounceEl = $('bouncePairs');
  var traceRise = $('trace_rise'), traceArea = $('trace_area');

  var STEPS = [
    { cap: "1. Start with the substrate.",
      cap2: "A flat support wafer, for example silicon or sapphire." },
    { cap: "2. Deposit the base electrode.",
      cap2: "A superconducting film, for example niobium or tantalum." },
    { cap: "3. Grow the tunnel barrier.",
      cap2: "A thin insulating layer, about 1 nanometer thick." },
    { cap: "4. Deposit the top electrode.",
      cap2: "A second superconducting film. It absorbs the photon." },
    { cap: "5. Cool the device to about 0.4 kelvin.",
      cap2: "Cool below the critical temperature Tc." },
    { cap: "6. Cooper pairs form in both electrodes.",
      cap2: "The electrons bind in twos into Cooper pairs." },
    { cap: "7. Apply the magnetic field.",
      cap2: "Parallel to the barrier, it blocks Cooper-pair tunneling." },
    { cap: "8. Apply a small bias voltage.",
      cap2: "Set across the junction." },
    { cap: "9. A single photon strikes the top electrode.",
      cap2: "Absorbed in the top film, carrying energy hν." },
    { cap: "10. Absorption breaks Cooper pairs into quasiparticles.",
      cap2: "One photon frees thousands of quasiparticles." },
    { cap: "11. The bias sweeps the quasiparticles across the barrier.",
      cap2: "Each one tunnels through the barrier into the base electrode." },
    { cap: "12. The tunneling events are too fast to count one by one.",
      cap2: "The readout measures the total charge instead: Q = N · e." },
    { cap: "13. The charge is proportional to the number of quasiparticles.",
      cap2: "The pulse size gives the photon number: full photon-number resolution." }
  ];
  var N = STEPS.length;

  // persistent looping animation (blocked pairs bobbing at the barrier)
  var bounceAnim = anime({ targets: bounceEl, translateY: [0, 24], direction: 'alternate', loop: true, duration: 720, easing: 'easeInOutSine', autoplay: false });

  var s = 0, playing = true, timer = null, traceDrawn = false, instant = false;

  // creates an anime tween; when an instant park is requested, jump it to its end state
  function tween(params) {
    var a = anime(params);
    if (instant) { a.seek(a.duration); a.pause(); }
    return a;
  }

  var chipsBox = $('chips');
  STEPS.forEach(function (_, k) {
    var b = document.createElement('button');
    b.className = 'chip'; b.type = 'button'; b.textContent = k + 1;
    b.addEventListener('click', function () { stop(); go(k); });
    chipsBox.appendChild(b);
  });
  var chips = Array.prototype.slice.call(chipsBox.children);

  function render(step) {
    s = step;
    // s = -1 is the boot park: empty stage, nothing built until the first step is pressed
    $('cap').textContent = s >= 0 ? STEPS[s].cap : 'Superconducting tunnel junction';
    $('cap2').textContent = s >= 0 ? STEPS[s].cap2 : 'Built step by step.';

    // ----- declarative structure / panels -----
    on('Lsub', s >= 0); on('Lbase', s >= 1); on('Lbar', s >= 2); on('Ltop', s >= 3);
    on('labSub', s >= 0 && s <= 4); on('labBase', s >= 1 && s <= 4); on('labTop', s >= 3 && s <= 4);
    on('barLead', s >= 2 && s <= 3);
    on('bom', s >= 0 && s <= 3);
    on('bom4', s >= 0 && s <= 3); on('bom3', s >= 1 && s <= 3); on('bom2', s >= 2 && s <= 3); on('bom1', s >= 3 && s <= 3);
    on('tempbadge', s >= 4);
    on('cpDef', s === 5);
    on('circuit', s >= 7);
    on('quasilab', s >= 9);
    on('scope', s >= 9);
    on('chargeNote', s >= 11);
    on('trace_note', s >= 12);
    on('takeaway', s >= 12);

    // ----- animated pieces -----
    animCooper(cpTopEls, s >= 5 && s < 9);   // top pairs break at step 9 (index 9)
    animCooper(cpBaseEls, s >= 5);
    animField(s >= 6);
    animPhoton(s === 8);
    animQuasi(s >= 9, s >= 10);
    animBounce(s === 10);
    animTrace(s >= 10, s >= 11);

    chips.forEach(function (c, k) { c.classList.toggle('active', k === step); });

    try { parent.postMessage({ animState: { step: s + 1, total: N } }, '*'); } catch (e) {}
  }

  function animCooper(els, show) {
    anime.remove(els);
    tween({ targets: els, opacity: show ? 1 : 0, duration: show ? 480 : 240,
            delay: show ? anime.stagger(55) : 0, easing: 'easeOutQuad' });
  }
  function animField(show) {
    anime.remove(fieldEl);
    tween({ targets: fieldEl, opacity: show ? 1 : 0, duration: show ? 400 : 200, easing: 'linear' });
  }
  function animPhoton(show) {
    anime.remove(photonEl);
    if (show) { photonEl.style.opacity = 1; tween({ targets: photonEl, translateY: [-150, 0], duration: 1000, easing: 'easeInQuad' }); }
    else { photonEl.style.opacity = 0; photonEl.style.transform = 'translateY(0px)'; }
  }
  function animQuasi(show, tunneled) {
    anime.remove(qDots);
    tween({ targets: qDots, opacity: show ? 1 : 0, translateY: tunneled ? 72 : 0,
            duration: show ? 850 : 240, delay: show ? anime.stagger(40) : 0, easing: 'easeInOutQuad' });
  }
  function animBounce(show) {
    if (show) { bounceEl.style.opacity = 1; bounceAnim.play(); }
    else { bounceAnim.pause(); bounceEl.style.opacity = 0; bounceEl.style.transform = 'translateY(0px)'; }
  }
  function animTrace(rise, area) {
    anime.remove(traceRise); anime.remove(traceArea);
    if (rise) {
      traceRise.style.opacity = 1;
      if (!traceDrawn) { tween({ targets: traceRise, strokeDashoffset: [anime.setDashoffset, 0], duration: 1100, easing: 'easeInOutSine' }); traceDrawn = true; }
    } else { traceRise.style.opacity = 0; traceRise.removeAttribute('stroke-dasharray'); traceRise.removeAttribute('stroke-dashoffset'); traceDrawn = false; }
    tween({ targets: traceArea, opacity: area ? 0.16 : 0, duration: area ? 500 : 200, easing: 'linear' });
  }

  function go(n) { s = Math.max(0, Math.min(N - 1, n)); render(s); }
  function goInstant(n) {
    instant = true;
    document.body.classList.add('noanim');
    go(n);
    void document.body.offsetWidth; // flush styles while transitions are off
    document.body.classList.remove('noanim');
    instant = false;
  }
  // boot park: empty stage before step 1 (user order: nothing runs, nothing is
  // built, until the first step is pressed). Announces step 0 to the deck.
  function parkStart() {
    instant = true;
    document.body.classList.add('noanim');
    render(-1);
    void document.body.offsetWidth;
    document.body.classList.remove('noanim');
    instant = false;
  }
  function next() { if (s < N - 1) go(s + 1); else stop(); }
  function stopTimer() { if (timer) { clearTimeout(timer); timer = null; } }
  function auto() { stopTimer(); timer = setTimeout(function () { if (playing) { if (s < N - 1) { next(); auto(); } else stop(); } }, 3500); }
  function play() { playing = true; $('play').innerHTML = '&#10074;&#10074;'; if (s >= N - 1) go(0); auto(); }
  function stop() { playing = false; $('play').innerHTML = '&#9654;'; stopTimer(); }

  $('next').addEventListener('click', function () { stop(); next(); });
  $('prev').addEventListener('click', function () { stop(); go(s - 1); });
  $('play').addEventListener('click', function () { playing ? stop() : play(); });
  $('replay').addEventListener('click', function () { go(0); play(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { stop(); next(); }
    if (e.key === 'ArrowLeft') { stop(); go(s - 1); }
  });

  // deck-step API: the parent deck drives the steps over postMessage
  addEventListener('message', function (e) {
    var d = e && e.data;
    if (!d || !d.anim) return;
    if (d.anim === 'next') { stop(); next(); }
    else if (d.anim === 'prev') { stop(); go(s - 1); }
    else if (d.anim === 'goto' && isFinite(d.step)) { stop(); goInstant(d.step - 1); }
  });

  // boot: no autoplay; park instantly (hash keeps its 0-based step index meaning)
  var h = parseInt((location.hash || '').slice(1), 10);
  stop();
  if (isFinite(h)) goInstant(h); else parkStart();
})();
</script>
<script>
(function () {
  var d = document.documentElement;
  function apply(t) { d.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light'); }
  var m = (location.search.match(/[?&]theme=(dark|light)/) || [])[1];
  apply(m || 'light');
  addEventListener('message', function (e) {
    if (e && e.data && (e.data.theme === 'dark' || e.data.theme === 'light')) apply(e.data.theme);
  });
})();
</script>
